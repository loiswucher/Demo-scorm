<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Démarche Clinique — Le cas de M. Marcel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#EDF1EA; --carte:#FFFFFF; --encre:#22313A; --encre2:#5C6C75;
  --vert:#3E7A63; --vert-f:#2C5A49; --vert-p:#E3EEE8;
  --mimosa:#F2C14E; --mimosa-f:#C79127; --mimosa-p:#FBF0D3;
  --alerte:#C4574E; --alerte-p:#F8E7E5; --bleu:#3E6C8E; --bleu-p:#E4EDF4;
  --ligne:#D6DFD6; --ombre:0 2px 10px rgba(34,49,58,.08);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--fond);color:var(--encre);font-size:16px;line-height:1.5;min-height:100vh}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Nunito Sans',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;font-size:1rem}
.hidden{display:none!important}

/* ======= EN-TÊTE & PROGRESSION ======= */
header{background:var(--carte);border-bottom:1px solid var(--ligne);padding:10px 18px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:1.05rem;font-weight:800;letter-spacing:.2px}
.brand small{display:block;color:var(--encre2);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.steps{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--fond);color:var(--encre2);font-size:.78rem;font-weight:700}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--ligne);color:var(--encre2);display:grid;place-items:center;font-size:.72rem}
.step.on{background:var(--vert);color:#fff}
.step.on .n{background:rgba(255,255,255,.25);color:#fff}
.step.done{background:var(--vert-p);color:var(--vert-f)}
.step.done .n{background:var(--vert);color:#fff}
.step span.lbl{display:none}
@media(min-width:980px){.step span.lbl{display:inline}}

/* ======= MISE EN PAGE ======= */
main{max-width:1180px;margin:0 auto;padding:22px 16px 90px}
.card{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:22px}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.grid2{grid-template-columns:1.5fr 1fr}}
.btn{background:var(--vert);color:#fff;padding:12px 22px;border-radius:99px;font-weight:800;font-size:1rem;transition:transform .12s, background .12s;box-shadow:var(--ombre)}
.btn:hover{background:var(--vert-f);transform:translateY(-1px)}
.btn:disabled{background:var(--ligne);color:var(--encre2);cursor:not-allowed;transform:none;box-shadow:none}
.btn.sec{background:var(--carte);color:var(--vert-f);border:2px solid var(--vert)}
.btn.sec:hover{background:var(--vert-p)}
.btn.warn{background:var(--mimosa);color:#5b430a}
.btn.warn:hover{background:var(--mimosa-f);color:#fff}
.tag{display:inline-block;background:var(--bleu-p);color:var(--bleu);border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.eyebrow{color:var(--vert-f);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:.75rem;margin-bottom:6px}
.acte-title{font-size:1.7rem;font-weight:800;margin-bottom:4px}
.acte-sub{color:var(--encre2);margin-bottom:18px;max-width:70ch}

/* ======= ACCUEIL ======= */
.hero{display:grid;grid-template-columns:1fr;gap:26px;align-items:center;margin-top:14px}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h2{font-size:clamp(1.9rem,4vw,3rem);font-weight:800;line-height:1.12;margin-bottom:14px}
.hero h2 em{font-style:normal;color:var(--vert);position:relative}
.hero p{color:var(--encre2);font-size:1.05rem;max-width:56ch;margin-bottom:12px}
.hero .mission{background:var(--mimosa-p);border-left:4px solid var(--mimosa);padding:14px 16px;border-radius:0 10px 10px 0;margin:16px 0;font-weight:600}
.hero-scene{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:10px}
.hero-scene svg{width:100%;height:auto;display:block;border-radius:10px}

/* ======= ACTE 1 : HUB & SCÈNES ======= */
.jauge-wrap{display:flex;align-items:center;gap:10px;background:var(--carte);border-radius:99px;padding:8px 16px;box-shadow:var(--ombre);margin-bottom:18px;flex-wrap:wrap}
.jauge-wrap b{font-size:.85rem;color:var(--encre2)}
.jauge{flex:1;min-width:140px;height:10px;background:var(--fond);border-radius:99px;overflow:hidden}
.jauge i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--vert),var(--mimosa));border-radius:99px;transition:width .5s}
.jauge-pct{font-weight:800;color:var(--vert-f);font-size:.9rem;min-width:44px;text-align:right}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.lieu{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:0;overflow:hidden;text-align:left;transition:transform .15s;border:2px solid transparent}
.lieu:hover{transform:translateY(-3px);border-color:var(--vert)}
.lieu svg{width:100%;height:120px;display:block}
.lieu .li-body{padding:12px 14px 14px}
.lieu h3{font-size:1.05rem;font-weight:800}
.lieu p{color:var(--encre2);font-size:.85rem;margin-top:2px}
.lieu .visited{font-size:.75rem;font-weight:800;color:var(--vert-f);margin-top:6px;display:none}
.lieu.vu .visited{display:block}

.scene{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:920px){.scene{grid-template-columns:1fr 1fr}}
.scene-visuel{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:12px}
.scene-visuel svg{width:100%;height:auto;display:block;border-radius:10px}
.bulle{background:var(--bleu-p);border-radius:12px;padding:14px 16px;margin-top:12px;position:relative;font-size:.98rem;min-height:54px}
.bulle::before{content:"";position:absolute;top:-9px;left:34px;border:10px solid transparent;border-bottom-color:var(--bleu-p);border-top:0}
.bulle .qui{font-weight:800;color:var(--bleu);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.q-list{display:flex;flex-direction:column;gap:8px}
.q-item{background:var(--carte);border:1.5px solid var(--ligne);border-radius:10px;padding:11px 14px;text-align:left;font-size:.94rem;transition:border-color .12s, background .12s}
.q-item:hover{border-color:var(--vert);background:var(--vert-p)}
.q-item.asked{opacity:.55;border-style:dashed}
.q-item.unlock{border-color:var(--mimosa);background:var(--mimosa-p);font-weight:700;animation:pop .4s}
@keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.note-offer{margin-top:10px;background:var(--mimosa-p);border:1.5px dashed var(--mimosa-f);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note-offer .nt{font-size:.9rem;font-weight:700}
.note-offer button{background:var(--vert);color:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:.85rem}
.note-offer button.ignorer{background:transparent;color:var(--encre2);text-decoration:underline;font-weight:600}

/* Carnet de recueil (signature) */
.carnet{position:fixed;bottom:0;right:14px;width:min(340px,92vw);z-index:60;transition:transform .3s;transform:translateY(calc(100% - 46px))}
.carnet.open{transform:translateY(0)}
.carnet-tab{background:var(--encre);color:#fff;border-radius:12px 12px 0 0;padding:10px 18px;font-weight:800;display:flex;align-items:center;gap:10px;width:100%;font-size:.92rem}
.carnet-tab .cnt{background:var(--mimosa);color:#5b430a;border-radius:99px;padding:1px 9px;font-size:.8rem}
.carnet-body{background:#FFFDF5;border:1px solid var(--ligne);border-top:none;max-height:46vh;overflow-y:auto;padding:14px;background-image:repeating-linear-gradient(#FFFDF5 0 27px,#EDE6D2 27px 28px)}
.carnet-body ul{list-style:none}
.carnet-body li{font-size:.88rem;padding:4px 0 4px 20px;position:relative;font-weight:600}
.carnet-body li::before{content:"✎";position:absolute;left:0;color:var(--vert)}
.carnet-body .vide{color:var(--encre2);font-style:italic;padding:6px 0}

/* Dossier patient */
.dossier{font-family:'IBM Plex Mono',monospace;background:#FDFBF3;border:1px solid #E4DCC3;border-radius:10px;padding:18px;font-size:.86rem}
.dossier h4{font-family:'IBM Plex Mono',monospace;border-bottom:2px solid #E4DCC3;padding-bottom:6px;margin:14px 0 8px;font-size:.9rem;letter-spacing:.04em}
.dossier h4:first-child{margin-top:0}
.d-item{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .12s}
.d-item:hover{background:var(--mimosa-p)}
.d-item.sel{background:var(--vert-p);outline:1.5px solid var(--vert)}
.d-item input{margin-top:3px;accent-color:var(--vert)}

/* ======= ACTE 2 : HENDERSON ======= */
.tray{position:sticky;top:64px;z-index:40;background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:12px 14px;margin-bottom:16px}
.tray h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--encre2);margin-bottom:8px}
.tray-chips{display:flex;flex-wrap:wrap;gap:7px;max-height:130px;overflow-y:auto}
.chip{background:var(--bleu-p);color:var(--encre);border:1.5px solid transparent;border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700;transition:all .12s}
.chip:hover{border-color:var(--bleu)}
.chip.sel{background:var(--encre);color:#fff;transform:scale(1.05)}
.chip.pi{background:var(--fond);color:var(--encre2);border:1.5px dashed var(--encre2)}
.chip.sup{background:var(--mimosa-p)}
.vh-table{width:100%;border-collapse:separate;border-spacing:0 8px}
.vh-table th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;text-align:left}
.vh-table th.ok{color:var(--vert-f)}.vh-table th.ko{color:var(--alerte)}
.vh-row td{background:var(--carte);padding:10px;vertical-align:top;box-shadow:var(--ombre)}
.vh-row td:first-child{border-radius:12px 0 0 12px;font-weight:800;font-size:.88rem;width:19%}
.vh-row td:last-child{border-radius:0 12px 12px 0}
.cell{min-height:44px;border-radius:9px;border:1.5px dashed var(--ligne);padding:6px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;transition:all .12s;width:100%}
.cell.target{border-color:var(--vert);background:var(--vert-p);cursor:pointer}
.cell.v-ok{border-color:var(--vert);border-style:solid;background:var(--vert-p)}
.cell.v-manque{border-color:var(--mimosa-f);border-style:solid;background:var(--mimosa-p)}
.cell.v-erreur{border-color:var(--alerte);border-style:solid;background:var(--alerte-p)}
.placed{background:#fff;border:1.5px solid var(--bleu);border-radius:99px;padding:3px 8px 3px 11px;font-size:.76rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.placed b{cursor:pointer;color:var(--alerte);font-size:.9rem;line-height:1}
.corbeille{border:2px dashed var(--alerte);background:var(--alerte-p);border-radius:var(--r);padding:16px;text-align:center;font-weight:800;color:var(--alerte);margin-top:16px;transition:all .12s}
.corbeille.target{background:var(--alerte);color:#fff;cursor:pointer}

/* ======= ACTES 3 & 5 : BLOCS ======= */
.builder{display:flex;flex-direction:column;gap:16px}
.concl{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:18px;border-left:5px solid var(--ligne)}
.concl.valide{border-left-color:var(--vert)}
.concl h4{font-size:1rem;margin-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 14px}
.blk{background:var(--fond);border:1.5px solid var(--ligne);border-radius:10px;padding:7px 13px;font-size:.86rem;font-weight:600;text-align:left;transition:all .12s}
.blk:hover{border-color:var(--vert)}
.blk.on{background:var(--vert);border-color:var(--vert);color:#fff}
.blk.on.intitule{background:var(--encre);border-color:var(--encre)}
.sect-lbl{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--encre2);margin-top:10px}
.phrase{background:var(--vert-p);border-radius:10px;padding:12px 14px;font-size:.94rem;margin:10px 0;min-height:46px}
.phrase em{color:var(--encre2);font-style:italic}
.feedback{border-radius:10px;padding:12px 14px;margin-top:10px;font-size:.92rem;font-weight:600;display:none}
.feedback.err{display:block;background:var(--alerte-p);color:var(--alerte);border-left:4px solid var(--alerte)}
.feedback.okk{display:block;background:var(--vert-p);color:var(--vert-f);border-left:4px solid var(--vert)}
.feedback.hint{display:block;background:var(--mimosa-p);color:#7a5c10;border-left:4px solid var(--mimosa)}
.progress-noyau{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pn{background:var(--carte);border:1.5px solid var(--ligne);border-radius:99px;padding:5px 13px;font-size:.8rem;font-weight:800;color:var(--encre2)}
.pn.ok{background:var(--vert);border-color:var(--vert);color:#fff}
.pn.bonus{border-style:dashed}

/* ======= ACTE 4 : QUESTIONS ======= */
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.quiz-prob{font-weight:800;font-size:1.05rem}
.quiz-num{color:var(--encre2);font-weight:700;font-size:.85rem}
.q-enonce{font-size:1.08rem;font-weight:700;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--fond);border:1.5px solid var(--ligne);border-radius:11px;padding:12px 15px;text-align:left;font-size:.95rem;transition:all .12s}
.opt:hover{border-color:var(--vert)}
.opt.on{background:var(--bleu-p);border-color:var(--bleu);font-weight:700}
.opt.juste{background:var(--vert-p);border-color:var(--vert);font-weight:700}
.opt.faux{background:var(--alerte-p);border-color:var(--alerte)}
.order-zone{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;min-height:40px;border:1.5px dashed var(--ligne);border-radius:10px;padding:10px}
.order-zone .ord{background:var(--vert-p);border:1.5px solid var(--vert);border-radius:9px;padding:8px 12px;font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center}
.order-zone .ord i{font-style:normal;background:var(--vert);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.75rem;flex:none}

/* ======= ACTE 5 ======= */
.ps-prob{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);padding:18px;margin-bottom:16px;border-top:4px solid var(--vert)}
.ps-prob>h4{font-size:1.05rem;margin-bottom:4px}
.ps-prob .rappel{font-size:.85rem;color:var(--encre2);font-style:italic;margin-bottom:12px}

/* ======= BADGES & BILAN ======= */
.stars{color:var(--mimosa-f);letter-spacing:2px;font-size:1.1rem}
.bilan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.badge{background:var(--carte);border-radius:12px;padding:14px 10px;text-align:center;box-shadow:var(--ombre);border:2px solid var(--mimosa)}
.badge .ic{font-size:1.9rem}
.badge h5{font-size:.85rem;margin:6px 0 3px}
.badge p{font-size:.72rem;color:var(--encre2)}
.badge.off{border-color:var(--ligne);filter:grayscale(1);opacity:.55}
.sugg{background:var(--mimosa-p);border-left:4px solid var(--mimosa);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:8px;font-size:.92rem;font-weight:600}
.acte-recap{background:var(--carte);border-radius:12px;padding:14px;box-shadow:var(--ombre);display:flex;justify-content:space-between;align-items:center;gap:8px}
.acte-recap b{font-size:.9rem}

/* ======= MODALE ======= */
.modal-bg{position:fixed;inset:0;background:rgba(34,49,58,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--carte);border-radius:var(--r);max-width:520px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s}
.modal h3{margin-bottom:10px;font-size:1.2rem}
.modal p{color:var(--encre2);margin-bottom:16px}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--encre);color:#fff;border-radius:99px;padding:11px 22px;font-weight:700;font-size:.9rem;z-index:120;transition:transform .3s;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

.footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}

/* ======= V2 : CLASSEUR (dossier patient) ======= */
.classeur{background:var(--carte);border-radius:var(--r);box-shadow:var(--ombre);overflow:hidden}
.onglets{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 0;background:#E7E2D2}
.onglet{background:#D8D1BC;border-radius:10px 10px 0 0;padding:9px 16px;font-weight:800;font-size:.82rem;color:#6b6350;transition:all .12s}
.onglet:hover{background:#CFC7AE}
.onglet.on{background:#FDFBF3;color:var(--encre)}
.classeur-page{padding:14px;background:#FDFBF3}
.classeur-page .dossier{border:none;padding:4px}

/* ======= V2 : ASSISTANTS GUIDÉS ======= */
.wiz-besoin{font-family:'Bricolage Grotesque',sans-serif;font-size:1.25rem;line-height:1.25;background:var(--vert-p);border-left:5px solid var(--vert);border-radius:0 12px 12px 0;padding:12px 16px;margin-bottom:16px}
.wiz-besoin b{font-size:1.4rem}
.ouinon{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.ouinon .btn{flex:1;min-width:150px;padding:15px 18px;font-size:1.02rem}
.ck-list{display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto;margin:8px 0 4px;padding-right:4px}
.ck-chip{display:flex;gap:10px;align-items:flex-start;background:var(--fond);border:1.5px solid var(--ligne);border-radius:10px;padding:9px 12px;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .12s}
.ck-chip:hover{border-color:var(--vert)}
.ck-chip input{margin-top:2px;accent-color:var(--vert);flex:none}
.ck-chip:has(input:checked){background:var(--vert-p);border-color:var(--vert)}

/* ======= V2 : MINI-TABLEAU EN ARRIÈRE-PLAN ======= */
.mini-table{display:flex;flex-direction:column;gap:6px;max-height:64vh;overflow-y:auto;padding-right:4px}
.mt-row{background:var(--fond);border-radius:10px;padding:8px 10px;border-left:4px solid var(--ligne)}
.mt-row b{font-size:.8rem;display:block}
.mt-row.cur{border-left-color:var(--mimosa-f);background:var(--mimosa-p)}
.mt-row.fait{border-left-color:var(--vert)}
.mt-cell{font-size:.74rem;margin-top:4px;border-radius:7px;padding:4px 8px;font-weight:600}
.mt-cell.ok{background:var(--vert-p);color:var(--vert-f)}
.mt-cell.ko{background:var(--alerte-p);color:var(--alerte)}
.mt-cell.vide{background:#fff;color:var(--encre2);font-style:italic}
.mt-cell.obj{background:var(--mimosa-p);color:#7a5c10}
.mt-cell.act{background:var(--vert-p);color:var(--vert-f)}
.mt-cell.ev{background:var(--bleu-p);color:var(--bleu)}
.mt-cell.ev i{display:block;font-size:.68rem;opacity:.85}


/* ======= V2.1 : TRACE ÉCRITE ======= */
.trace-h{font-size:1rem;margin:18px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--vert-p);color:var(--vert-f)}
.trace-h:first-child{margin-top:0}
.trace-ul{margin:4px 0 8px 20px;font-size:.9rem}
.trace-ul li{margin:2px 0}
.trace-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:8px 0 14px}
.trace-table th{background:var(--vert-p);color:var(--vert-f);text-align:left;padding:7px 9px;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.trace-table td{border:1px solid var(--ligne);padding:7px 9px;vertical-align:top}
.trace-table .trace-ul{margin:0 0 0 16px}


/* ======= MODE DÉMONSTRATION (formateur) ======= */
#godDot{background:none;color:var(--encre2);opacity:.15;font-size:.95rem;padding:4px;transition:opacity .2s}
#godDot:hover{opacity:.6}
#godBar{position:sticky;top:54px;z-index:49;background:var(--encre);display:flex;gap:6px;align-items:center;padding:7px 16px;flex-wrap:wrap}
.god-lbl{color:var(--mimosa);font-weight:800;font-size:.78rem;margin-right:6px}
.god-btn{background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:4px 13px;font-size:.78rem;font-weight:700;transition:background .12s}
.god-btn:hover{background:rgba(255,255,255,.25)}
.god-btn.on{background:var(--mimosa);color:#5b430a}
.god-btn.quit{margin-left:auto;background:rgba(196,87,78,.45)}
@media print{#godBar,#godDot{display:none!important}}

@media print{
  header,.carnet,.footer-nav,.btn,#toast{display:none!important}
  body{background:#fff}
  .card,.badge,.acte-recap{box-shadow:none;border:1px solid #ccc}
  #scr-bilan{display:block!important}
  main>section:not(#scr-bilan){display:none!important}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

};
function finActe1(){

/* ---------- ACTE 1 : SCÈNES (vagues) ---------- */
function initSceneState(id){
  if(state.sc[id])return;
  const sc=SCENES[id];
  const pool=shuffle(sc.questions.filter(q=>!q.locked&&!sc.init.includes(q.id)).map(q=>q.id));
  state.sc[id]={visible:[...sc.init],pool:pool,askedN:0};
}
function openScene(id){
  state.visited.add(id);
  if(id==="dossier"){renderClasseur("identite");return}
  initSceneState(id);
  const sc=SCENES[id];
  app.innerHTML=
  '<p class="eyebrow">Acte 1 · Recueil — '+esc(sc.nom)+'</p>'+
  '<div class="scene">'+
    '<div><div class="scene-visuel">'+SVGS[id](false)+
      '<div class="bulle" id="bulle"><span class="qui">'+esc(sc.qui)+'</span><span id="bulleTxt"><i>'+esc(sc.intro)+'</i></span></div>'+
      '<div id="noteOffer"></div>'+
    '</div></div>'+
    '<div class="card"><h3 style="margin-bottom:4px">Que faites-vous ?</h3>'+
    '<p style="font-size:.82rem;color:var(--encre2);margin-bottom:10px">💬 L\'entretien avance : de nouvelles questions apparaissent au fil de l\'échange.</p>'+
    '<div class="q-list" id="qList"></div>'+
    '<div class="footer-nav"><button class="btn sec" onclick="go(\'acte1\')">← Retour au service</button></div></div>'+
  '</div>';
  renderQuestions(id);
}
function renderQuestions(sceneId){
  const sc=SCENES[sceneId], st=state.sc[sceneId];
  let visibles=[...st.visible];
  // les questions débloquées (ex. découvertes conditionnelles) apparaissent en tête
  sc.questions.filter(q=>q.locked&&state.unlocked.has(q.id)&&!visibles.includes(q.id)).forEach(q=>visibles.unshift(q.id));
  // une question posée disparaît du listing
  visibles=visibles.filter(qid=>!state.asked.has(qid));
  $("#qList").innerHTML=(visibles.length?visibles.map(qid=>{
    const q=sc.questions.find(x=>x.id===qid);
    return '<button class="q-item'+(q.locked?" unlock":"")+'" onclick="ask(\''+sceneId+'\',\''+q.id+'\')">'+esc(q.q)+'</button>';
  }).join(""):'<p style="font-size:.86rem;color:var(--encre2);font-style:italic;padding:6px 2px">Vous avez épuisé vos questions ici. D\'autres sources vous attendent…</p>')+
  (st.pool.length?'<p style="font-size:.78rem;color:var(--encre2);font-style:italic;padding:4px 2px">… poursuivez l\'échange pour ouvrir de nouvelles pistes.</p>':"");
}
function ask(sceneId,qid){
  const sc=SCENES[sceneId], st=state.sc[sceneId];
  const q=sc.questions.find(x=>x.id===qid);
  const nouvelle=!state.asked.has(qid);
  state.asked.add(qid);
  $("#bulleTxt").innerHTML=esc(q.r);
  const off=$("#noteOffer");off.innerHTML="";
  if(q.unlock&&!state.unlocked.has(q.unlock)){state.unlocked.add(q.unlock);toast("💡 Une nouvelle action est disponible : un signe appelle une vérification !")}
  if(nouvelle&&!q.locked){
    st.askedN++;
    if(st.askedN%2===0&&st.pool.length){
      const n=Math.min(st.pool.length,2+Math.floor(Math.random()*2)); // vague de 2-3
      for(let i=0;i<n;i++)st.visible.push(st.pool.shift());
      toast("💬 L'échange se poursuit : de nouvelles questions s'ouvrent…");
    }
  }
  const chipsHere=q.chip2?q.chip2:(q.chip?[q.chip]:[]);
  const news=chipsHere.filter(c=>!state.chips.has(c));
  if(news.length){
    off.innerHTML='<div class="note-offer"><span class="nt">📓 Noter au carnet : «&nbsp;'+news.map(c=>esc(CHIPS[c].t)).join("&nbsp;» et «&nbsp;")+'&nbsp;» ?</span>'+
    '<span><button onclick="noter(\''+news.join(",")+'\')">Noter</button> <button class="ignorer" onclick="this.closest(\'.note-offer\').remove()">Ne pas noter</button></span></div>';
  }
  renderQuestions(sceneId);
}
function noter(ids){
  ids.split(",").forEach(addChip);
  $("#noteOffer").innerHTML="";
  toast("✎ Noté au carnet.");
}

function fb2(cls,msg){const f=$("#fb2");f.className="feedback "+cls;f.innerHTML=msg}
function continueBtn2(label,fn){
  window._continue2=fn;
  const f=$("#fb2");
  f.innerHTML+='<div class="footer-nav" style="margin-top:10px"><span></span><button class="btn" onclick="window._continue2()">'+label+' →</button></div>';

function repCarte2(i){
  const h2=state.h2, chip=h2.queue[h2.idx], card=CARDS2[chip], o=state._optsH2[i];
  const btns=document.querySelectorAll(".opt");

      h2._besoinChoisi=o.besoin;
      continueBtn2("Continuer",()=>{h2.phase="col";RENDER.acte2()});

function repCol2(col){

/* ---------- ACTE 3 : CONCLUSION CLINIQUE GUIDÉE ---------- */
// N'affiche les intitulés qu'une fois trouvés (✓ + nom) ; sinon un simple compteur, pour ne pas donner les réponses à l'avance
function barreProgres3(labels,doneSet,bonus){
  if(!labels.length)return "";
  const trouves=labels.filter(n=>doneSet.has(n.g));
  const reste=labels.length-trouves.length;
  let html=trouves.map(n=>'<span class="pn ok">✓ '+n.l+'</span>').join("");
  if(reste>0)html+='<span class="pn'+(bonus?" bonus":"")+'">'+(bonus?"⭐ ":"")+reste+(bonus?" bonus à identifier":" à identifier")+'</span>';
  return html;
}
function initActe3(){
  if(state.c3)return;
  state.c3={cur:null,seq:[],seqIdx:0,parts:{causes:[],manifs:[]},doneG:new Set()};
}
RENDER.acte3=function(){
  initActe3();
  const c3=state.c3;
  const noyauOk=NOYAU_LABELS.every(n=>c3.doneG.has(n.g));
  let inner="";
  if(!c3.cur){
    // écran de choix d'intitulé
    const restants=Object.keys(PROB3).filter(id=>!c3.doneG.has(PROB3[id].groupe));
    const reels=restants.filter(id=>PROB3[id].noyau||noyauOk); // bonus proposés après le noyau
    if(reels.length===0||(noyauOk&&!state._bonusMode)){
      inner='<div class="card" style="text-align:center">'+
      '<h3 style="margin-bottom:8px">🧠 Noyau de la conclusion clinique complété !</h3>'+
      '<p style="color:var(--encre2);margin-bottom:16px">Cinq problèmes et risques sont posés. Votre regard peut encore s\'élargir : deux situations bonus se cachent dans ce cas… ⭐</p>'+
      '<div class="m-actions" style="justify-content:center">'+
      (BONUS_LABELS.some(n=>!c3.doneG.has(n.g))?'<button class="btn sec" onclick="state._bonusMode=true;RENDER.acte3()">⭐ Chercher un problème bonus</button>':"")+
      '<button class="btn" onclick="go(\'acte4prep\')">Justifier ma conclusion →</button></div></div>';
    }else{
      const pieges=INTITULES_PIEGES.filter(p=>!state.piegesUsed.has(p.t)).slice(0,2);
      const options=shuffle([
        ...reels.map(id=>({id:id,t:PROB3[id].intitule})),
        ...pieges.map(p=>({piege:p,t:p.t}))
      ]);
      inner='<div class="card">'+
      '<p class="q-enonce">Quel problème ou risque identifiez-vous chez M. Marcel ?</p>'+
      '<p style="font-size:.85rem;color:var(--encre2);margin-bottom:12px">Choisissez un intitulé — méfiez-vous, certains sont des pièges.</p>'+
      '<div class="opts">'+options.map((o,i)=>{
        if(o.piege)return '<button class="opt" onclick="pickPiege3('+INTITULES_PIEGES.indexOf(o.piege)+')">'+esc(o.t)+'</button>';
        return '<button class="opt" onclick="pickProb3(\''+o.id+'\')">'+esc(o.t)+'</button>';
      }).join("")+'</div>'+
      '<div class="feedback" id="fb3"></div></div>';
    }
  }else{
    // séquence binaire du problème en cours
    const p=PROB3[c3.cur];
    const step=c3.seq[c3.seqIdx];
    const phrase="<b>"+esc(p.intitule)+"</b>"+
      (c3.parts.causes.length?" lié(e) à "+esc(c3.parts.causes.join(", ")):" <em>lié(e) à …</em>")+
      (c3.parts.manifs.length?" se manifestant par "+esc(c3.parts.manifs.join(", ")):(p.risque?"":(c3.seqIdx>=p.causes.length?" <em>se manifestant par …</em>":"")))+".";
    let stepHtml="";
    if(step.kind==="cause"){
      const duo=shuffle([{t:step.ok,ok:1},{t:step.ko.t,ok:0,msg:step.ko.msg}]);
      stepHtml='<p class="q-enonce">Cause '+(c3.seqIdx+1)+' — ce problème est lié à…</p>'+
      '<div class="opts">'+duo.map((d,i)=>'<button class="opt" onclick="repBin3('+d.ok+','+i+')">'+esc(d.t)+'</button>').join("")+'</div>';
      state._duo=duo;
    }else if(step.kind==="manif"){
      const duo=shuffle([{t:step.ok,ok:1},{t:step.ko.t,ok:0,msg:step.ko.msg}]);
      stepHtml='<p class="q-enonce">Et cela se manifeste par…</p>'+
      '<div class="opts">'+duo.map((d,i)=>'<button class="opt" onclick="repBin3('+d.ok+','+i+')">'+esc(d.t)+'</button>').join("")+'</div>';
      state._duo=duo;
    }else if(step.kind==="risk"){
      stepHtml='<p class="q-enonce">Ce risque se manifeste-t-il par des signes observables chez M. Marcel ?</p>'+
      '<div class="ouinon"><button class="btn sec" onclick="repRisk3(true)">Oui</button><button class="btn" onclick="repRisk3(false)">Non</button></div>';
    }
    inner='<div class="card">'+
    '<div class="phrase">'+phrase+'</div>'+stepHtml+
    '<div class="feedback" id="fb3"></div>'+
    '<div class="footer-nav" class="hidden"><span></span><button class="btn hidden" id="btn3next" onclick="next3()">Continuer →</button></div>'+
    '</div>';
  }
  app.innerHTML=
  '<p class="eyebrow">Acte 3 · Conclusion clinique</p>'+
  '<h2 class="acte-title">Que concluez-vous de votre analyse ?</h2>'+
  '<p class="acte-sub">Un problème à la fois. À chaque étape, un seul choix tient la route cliniquement : <b>problème lié à… se manifestant par…</b> — ou <b>risque lié à…</b> (sans manifestations).</p>'+
  '<div class="progress-noyau">'+
    barreProgres3(NOYAU_LABELS,c3.doneG,false)+
    barreProgres3(BONUS_LABELS,c3.doneG,true)+
  '</div>'+inner+
  '<div class="builder" id="valides" style="margin-top:16px">'+state.validated.map(id=>{
    const p=PROB3[id];
    return '<div class="concl valide"><h4>'+(p.risque?"⚠️ ":"🩺 ")+esc(p.intitule)+'</h4><p style="font-size:.9rem">lié(e) à '+esc(p.causes.map(c=>c.ok).join(", "))+(p.manifs.length?" se manifestant par "+esc(p.manifs.map(m=>m.ok).join(", ")):"")+'.</p></div>';
  }).join("")+'</div>';
};
function fb3(cls,msg){const f=$("#fb3");if(f){f.className="feedback "+cls;f.innerHTML=msg}}
function pickPiege3(idx){
  const p=INTITULES_PIEGES[idx];
  state.piegesUsed.add(p.t);
  state.wrong3++;state.flags.add("piege3");
  fb3("err","🎭 "+p.msg);
}
function pickProb3(id){
  const p=PROB3[id];
  state.c3.cur=id;
  state.c3.seq=[...p.causes.map(c=>({kind:"cause",ok:c.ok,ko:c.ko})),
                ...(p.risque?[{kind:"risk"}]:p.manifs.map(m=>({kind:"manif",ok:m.ok,ko:m.ko})))];
  state.c3.seqIdx=0;state.c3.parts={causes:[],manifs:[]};
  RENDER.acte3();
}
function repBin3(ok,i){
  const step=state.c3.seq[state.c3.seqIdx];
  const btns=document.querySelectorAll(".opt");
  if(ok){
    btns.forEach(b=>b.disabled=true);btns[i].classList.add("juste");
    avancer3(step);
  }else{
    state.wrong3++;state.flags.add("piege3");
    btns.forEach(b=>b.disabled=true);
    btns[i].classList.add("faux");
    const okIdx=state._duo.findIndex(d=>d.ok);
    btns[okIdx].classList.add("juste");
    fb3("err","🎭 "+state._duo[i].msg+"<br><i>La bonne réponse est en vert — on enchaîne.</i>");
    $("#btn3next").classList.remove("hidden");
    state._pendingStep=step;
  }
}
function next3(){avancer3(state._pendingStep)}
function avancer3(step){
  if(step.kind==="cause")state.c3.parts.causes.push(step.ok);
  if(step.kind==="manif")state.c3.parts.manifs.push(step.ok);
  state.c3.seqIdx++;
  if(state.c3.seqIdx>=state.c3.seq.length)finirProb3();
  else RENDER.acte3();
}
function repRisk3(oui){
  if(!oui){
    fb3("okk","✅ Exact : un risque n'a pas de manifestations — sinon, ce serait un problème réel.");
    setTimeout(()=>{state.c3.seqIdx++;finirProb3()},1400);
  }else{
    state.wrong3++;state.flags.add("risqmanif");
    fb3("err","⛔ Un risque n'a PAS de manifestations : l'événement n'est pas encore survenu. S'il y avait des signes, ce serait un problème réel.");
    setTimeout(()=>{fb3("okk","On retient donc : risque lié à ses causes, sans manifestations.");setTimeout(()=>{state.c3.seqIdx++;finirProb3()},1400)},2600);
  }
}
function finirProb3(){
  const p=PROB3[state.c3.cur];
  state.validated.push(state.c3.cur);
  state.c3.doneG.add(p.groupe);
  const noyauOk=NOYAU_LABELS.every(n=>state.c3.doneG.has(n.g));
  const bonusRestants=BONUS_LABELS.some(n=>!state.c3.doneG.has(n.g));
  modal("👏 Problème complété !","<b>"+p.intitule+"</b> lié(e) à "+p.causes.map(c=>c.ok).join(", ")+(p.manifs.length?" se manifestant par "+p.manifs.map(m=>m.ok).join(", "):"")+".<br><br>"+(noyauOk?"Le noyau est complet !":"Continuez : d'autres problèmes attendent d'être posés."),
  [{t:noyauOk?(bonusRestants?"Continuer":"Voir la suite"):"Problème suivant →",fn:()=>{state.c3.cur=null;RENDER.acte3()}}]);
}

/* ---------- ACTE 4 : JUSTIFICATION (inchangé) ---------- */
RENDER.acte4prep=function(){
  state.stars.a3=state.wrong3===0?3:(state.wrong3<=2?2:1);
  const ordre=Object.keys(PROB3);
  state.quizQueue=[];
  ordre.forEach(id=>{
    if(!state.validated.includes(id))return;
    const p=PROB3[id];
    (QUESTIONS[p.groupe]||[]).forEach(q=>state.quizQueue.push({prob:p.intitule,q:q}));
  });
  state.quizIdx=0;
  go("acte4");
};
RENDER.acte4=function(){renderQuiz()};
function renderQuiz(){
  if(state.quizIdx>=state.quizQueue.length){finActe4();return}
  const item=state.quizQueue[state.quizIdx];
  let q=item.q;
  state.quizAttempt=0;
  state._curQ=q;
  app.innerHTML=
  '<p class="eyebrow">Acte 4 · Justification de la conclusion clinique</p>'+
  '<h2 class="acte-title">Justifiez : théorie, données, critères</h2>'+
  '<p class="acte-sub">Votre conclusion est posée — encore faut-il pouvoir la défendre. Répondez comme si votre formateur était en face de vous.</p>'+
  '<div class="card">'+
    '<div class="quiz-head"><span class="quiz-prob">🩺 '+esc(item.prob)+'</span><span class="quiz-num">Question '+(state.quizIdx+1)+' / '+state.quizQueue.length+'</span></div>'+
    '<p class="q-enonce">'+esc(q.q)+'</p>'+
    '<div id="qZone"></div>'+
    '<div class="feedback" id="fbQ"></div>'+
    '<div class="footer-nav"><span></span><button class="btn hidden" id="btnNext" onclick="state.quizIdx++;renderQuiz()">Question suivante →</button></div>'+
  '</div>';
  if(q.type==="qcm")renderQcm(q);
  else if(q.type==="multi")renderMulti(q);
  else if(q.type==="ordre")renderOrdre(q);
}
function fbQ(cls,msg){const f=$("#fbQ");f.className="feedback "+cls;f.innerHTML=msg}
function renderQcm(q){
  state._shuf=shuffle(q.opts.map((o,i)=>({t:o,orig:i})));
  $("#qZone").innerHTML='<div class="opts">'+state._shuf.map((o,i)=>
    '<button class="opt" data-i="'+i+'" onclick="repQcm('+i+')">'+esc(o.t)+'</button>').join("")+'</div>';
}
function repQcm(i){
  const q=state._curQ;
  const btns=document.querySelectorAll(".opt");
  const okIdx=state._shuf.findIndex(o=>o.orig===q.ok);
  if(state._shuf[i].orig===q.ok){
    btns.forEach(b=>b.disabled=true);
    btns[i].classList.add("juste");
    fbQ("okk",q.after||"✅ Exactement !");
    if(q.link&&state.quizAttempt>0)state.linkFails++;
    $("#btnNext").classList.remove("hidden");
  }else{
    btns[i].classList.add("faux");btns[i].disabled=true;
    if(state.quizAttempt===0){
      state.quizAttempt++;state.secondChances++;
      if(q.flag)state.flags.add(q.flag);
      fbQ("hint","💡 "+q.hint);
    }else{
      if(q.flag)state.flags.add(q.flag);
      btns.forEach(b=>b.disabled=true);
      btns[okIdx].classList.add("juste");
      if(q.link)state.linkFails++;
      fbQ("err","La bonne réponse est mise en évidence. Notez-la : elle reviendra dans votre bilan de révision.");
      $("#btnNext").classList.remove("hidden");
    }
  }
}
function renderMulti(q){
  state._shufM=shuffle([...q.opts]);
  $("#qZone").innerHTML='<div class="opts">'+state._shufM.map((o,i)=>
    '<button class="opt" data-i="'+i+'" onclick="this.classList.toggle(\'on\')">'+esc(o.t)+'</button>').join("")+'</div>'+
    '<div class="footer-nav"><span></span><button class="btn" id="btnValM" onclick="repMulti()">Valider ma sélection</button></div>';
}
function repMulti(){
  const q=state._curQ;
  const opts=state._shufM;
  const btns=[...document.querySelectorAll(".opt")];
  const sel=btns.map((b,i)=>b.classList.contains("on")?i:-1).filter(i=>i>=0);
  const okSet=opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
  const exact=sel.length===okSet.length&&okSet.every(i=>sel.includes(i));
  if(exact){
    btns.forEach((b,i)=>{b.disabled=true;if(opts[i].ok)b.classList.add("juste")});
    $("#btnValM").disabled=true;
    fbQ("okk","✅ Sélection complète et juste !");
    if(q.link&&state.quizAttempt>0)state.linkFails++;
    $("#btnNext").classList.remove("hidden");
  }else{
    const piegeSel=sel.map(i=>opts[i]).find(o=>!o.ok&&o.msg);
    if(piegeSel&&piegeSel.flag)state.flags.add(piegeSel.flag);
    if(state.quizAttempt===0){
      state.quizAttempt++;state.secondChances++;
      fbQ("hint","💡 "+(piegeSel?piegeSel.msg+"<br>":"")+q.hint);
    }else{
      btns.forEach((b,i)=>{b.disabled=true;b.classList.remove("on");if(opts[i].ok)b.classList.add("juste");else if(sel.includes(i))b.classList.add("faux")});
      $("#btnValM").disabled=true;
      if(q.link)state.linkFails++;
      fbQ("err","Les bonnes réponses sont en vert. Elles reviendront dans votre bilan de révision.");
      $("#btnNext").classList.remove("hidden");
    }
  }
}
let ordreSel=[];
function renderOrdre(q){
  ordreSel=[];
  const mel=shuffle(q.items.map((t,i)=>({t,i})));
  state._ordreMel=mel;
  $("#qZone").innerHTML=
    '<div class="order-zone" id="ordZone"><em style="color:var(--encre2)">Cliquez les blocs dans l\'ordre de la chaîne causale…</em></div>'+
    '<div class="bank" id="ordBank">'+mel.map((o,k)=>'<button class="blk" data-k="'+k+'" onclick="pickOrdre('+k+',this)">'+esc(o.t)+'</button>').join("")+'</div>'+
    '<div class="footer-nav"><button class="btn sec" onclick="renderOrdre(state._curQ)">Recommencer</button><button class="btn" onclick="repOrdre()">Valider la chaîne</button></div>';
}
function pickOrdre(k,btn){
  if(btn.disabled)return;
  btn.disabled=true;btn.style.opacity=.35;
  ordreSel.push(state._ordreMel[k].i);
  const z=$("#ordZone");
  if(ordreSel.length===1)z.innerHTML="";
  z.innerHTML+='<div class="ord"><i>'+ordreSel.length+'</i>'+esc(state._ordreMel[k].t)+'</div>';
}
function repOrdre(){
  const q=state._curQ;
  const ok=ordreSel.length===q.items.length&&ordreSel.every((v,i)=>v===i);
  if(ok){
    fbQ("okk","✅ La chaîne causale est limpide : c'est exactement ce raisonnement que l'on attend de vous en situation !");
    if(q.link&&state.quizAttempt>0)state.linkFails++;
    $("#btnNext").classList.remove("hidden");
  }else{
    if(state.quizAttempt===0){
      state.quizAttempt++;state.secondChances++;
      fbQ("hint","💡 "+q.hint);renderOrdre(q);
    }else{
      if(q.link)state.linkFails++;
      $("#ordZone").innerHTML=q.items.map((t,i)=>'<div class="ord"><i>'+(i+1)+'</i>'+esc(t)+'</div>').join("");
      $("#ordBank").innerHTML="";
      fbQ("err","Voici la chaîne attendue : chaque maillon entraîne le suivant.");
      $("#btnNext").classList.remove("hidden");
    }
  }
}
function finActe4(){
  state.stars.a4=state.secondChances===0?3:(state.secondChances<=3?2:1);
  modal("💬 Conclusion clinique justifiée !","Vos problèmes et risques sont verrouillés : ils sont maintenant pré-remplis dans votre projet de soins. Dernière ligne droite : <b>qu'allons-nous faire pour M. Marcel, aujourd'hui ?</b>",
  [{t:"Construire le projet de soins →",fn:()=>{initActe5();go("acte5")}}]);
}

/* ---------- ACTE 5 : PROJET DE SOINS EN ASSISTANT ---------- */
function initActe5(){
  const probs=Object.keys(PROJET);
  state.p5={probs:probs,idx:0,phase:"obj",ai:0,ei:0,relOnce:{},chosen:{}};
  probs.forEach(k=>{
    state.p5.chosen[k]={obj:null,actions:[],evals:[]};
    state.p5[k+"_actOrder"]=shuffle(PROJET[k].actions.map((a,i)=>i));
    state.p5[k+"_evalOrder"]=shuffle(PROJET[k].evals.map((e,i)=>i));
    state.p5[k+"_objOrder"]=shuffle(PROJET[k].objs.map((o,i)=>i));
  });
}
RENDER.acte5=function(){
  const p5=state.p5;
  if(p5.idx>=p5.probs.length){finActe5();return}
  const k=p5.probs[p5.idx], P=PROJET[k], C=p5.chosen[k];
  let wiz="";
  if(p5.phase==="obj"){
    wiz='<p class="q-enonce">Nous avons validé : <b>'+esc(P.titre)+'</b>.<br>Quel est votre objectif ?</p>'+
    '<div class="opts">'+p5[k+"_objOrder"].map(i=>
      '<button class="opt" onclick="repObj5('+i+',this)">'+esc(P.objs[i].t)+'</button>').join("")+'</div>';
  }else if(p5.phase==="act"){
    const ai=p5[k+"_actOrder"][p5.ai];
    const a=P.actions[ai];
    wiz='<p style="font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--encre2)">Action proposée '+(p5.ai+1)+' / '+P.actions.length+'</p>'+
    '<p class="q-enonce">« '+esc(a.t)+' »<br><span style="font-weight:600;color:var(--encre2)">L\'ajoutez-vous à votre projet de soins ?</span></p>'+
    '<div class="ouinon"><button class="btn" onclick="repAct5(true)">✔ Oui, je l\'ajoute</button><button class="btn sec" onclick="repAct5(false)">✘ Non, je l\'écarte</button></div>';
  }else if(p5.phase==="eval"){
    const ei=p5[k+"_evalOrder"][p5.ei];
    const e=P.evals[ei];
    wiz='<p style="font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--encre2)">Évaluation proposée '+(p5.ei+1)+' / '+P.evals.length+'</p>'+
    '<p class="q-enonce">« '+esc(e.t)+' »<br><span style="font-weight:600;color:var(--encre2)">La retenez-vous pour ce problème ?</span></p>'+
    '<div class="ouinon"><button class="btn" onclick="repEval5(true)">✔ Oui</button><button class="btn sec" onclick="repEval5(false)">✘ Non</button></div>';
  }else if(p5.phase==="lien"){
    const ei=p5[k+"_evalOrder"][p5.ei];
    const e=P.evals[ei];
    const opts=C.actions.map(ai2=>({v:ai2,t:P.actions[ai2].t})).concat([{v:"obj",t:"L'atteinte de l'objectif : « "+P.objs[C.obj].t+" »"}]);
    wiz='<p class="q-enonce">« '+esc(e.t)+' »<br><span style="font-weight:600;color:var(--encre2)">Que mesure cette évaluation ?</span></p>'+
    '<div class="opts">'+opts.map(o=>'<button class="opt" onclick="repLien5(\''+o.v+'\',this)">'+esc(o.t)+'</button>').join("")+'</div>';
  }
  app.innerHTML=
  '<p class="eyebrow">Acte 5 · Projet de soins — problème '+(p5.idx+1)+' / '+p5.probs.length+'</p>'+
  '<h2 class="acte-title">À ce jour, voilà ce que nous allons faire</h2>'+
  '<p class="acte-sub">Un objectif concis et réaliste, des actions concrètes d\'aujourd\'hui, et des évaluations reliées à vos actions. Méfiez-vous : certaines propositions n\'ont rien à faire dans un projet de soins…</p>'+
  '<div class="scene">'+
  '<div class="card" id="wiz5">'+wiz+'<div class="feedback" id="fb5"></div></div>'+
  '<div><div class="card"><h3 style="font-size:.95rem;margin-bottom:10px">📋 Votre projet se construit</h3><div class="mini-table" id="mini5"></div></div></div>'+
  '</div>';
  paintMini5();
};
function paintMini5(){
  const p5=state.p5, el=$("#mini5");if(!el)return;
  el.innerHTML=p5.probs.map((k,i)=>{
    const P=PROJET[k], C=p5.chosen[k];
    const fait=i<p5.idx, cur=i===p5.idx;
    if(!fait&&!cur)return '<div class="mt-row"><b>'+esc(P.titre)+'</b></div>';
    return '<div class="mt-row'+(cur?" cur":" fait")+'"><b>'+(fait?"✓ ":"")+esc(P.titre)+'</b>'+
    (C.obj!==null?'<div class="mt-cell obj">🎯 '+esc(P.objs[C.obj].t)+'</div>':"")+
    C.actions.map(ai=>'<div class="mt-cell act">• '+esc(P.actions[ai].t)+'</div>').join("")+
    C.evals.map(ev=>'<div class="mt-cell ev">📏 '+esc(P.evals[ev.i].t)+' <i>→ évalue : '+esc(ev.lien==="obj"?"l\'objectif":P.actions[ev.lien].t)+'</i></div>').join("")+
    '</div>';
  }).join("");
  const cur=el.querySelector(".mt-row.cur");if(cur)cur.scrollIntoView({block:"nearest"});
}
function fb5(cls,msg){const f=$("#fb5");f.className="feedback "+cls;f.innerHTML=msg}
function repObj5(i,btn){
  const p5=state.p5,k=p5.probs[p5.idx],P=PROJET[k];
  if(P.objs[i].ok){
    p5.chosen[k].obj=i;
    btn.classList.add("juste");
    paintMini5();
    setTimeout(()=>{p5.phase="act";p5.ai=0;RENDER.acte5()},600);
  }else{
    state.piegeSelect5++;
    btn.classList.add("faux");btn.disabled=true;
    fb5("err","🎭 "+P.objs[i].msg);
  }
}
function repAct5(oui){
  const p5=state.p5,k=p5.probs[p5.idx],P=PROJET[k];
  const ai=p5[k+"_actOrder"][p5.ai], a=P.actions[ai];
  const relKey=k+"_"+ai;
  if(a.ok){
    if(oui){
      p5.chosen[k].actions.push(ai);
      if(a.ecoute)state.ecouteYes=true;
      paintMini5();
      nextAct5();
    }else{
      if(a.req&&!p5.relOnce[relKey]){
        p5.relOnce[relKey]=true;state.relances++;
        fb5("hint","🤔 "+a.rel);
      }else if(a.req){
        p5.chosen[k].actions.push(ai);
        if(a.ecoute)state.ecouteYes=true;
        paintMini5();
        fb5("okk","Cette action est incontournable pour ce problème — nous la gardons dans le projet.");
        setTimeout(nextAct5,1700);
      }else{
        nextAct5();
      }
    }
  }else{
    if(oui){
      state.piegeSelect5++;
      if(a.malt){state.maltYes++;state.flags.add("malt")}
      if(a.flag)state.flags.add(a.flag);
      if(a.horsrole)state.flags.add("horsrole");
      fb5("err",(a.malt?"🛑 ":"🎭 ")+a.msg+"<br><i>Cette proposition n'entre pas dans le projet.</i>");
      setTimeout(nextAct5,2800);
    }else{
      toast("👍 Bien écarté.");
      nextAct5();
    }
  }
}
function nextAct5(){
  const p5=state.p5,k=p5.probs[p5.idx],P=PROJET[k];
  p5.ai++;
  if(p5.ai>=P.actions.length){p5.phase="eval";p5.ei=0}
  RENDER.acte5();
}
function repEval5(oui){
  const p5=state.p5,k=p5.probs[p5.idx],P=PROJET[k];
  const ei=p5[k+"_evalOrder"][p5.ei], e=P.evals[ei];
  const relKey=k+"_ev"+ei;
  if(e.ok){
    if(oui){p5.phase="lien";RENDER.acte5()}
    else{
      if(!p5.relOnce[relKey]){
        p5.relOnce[relKey]=true;state.relances++;state.flags.add("evallink");
        fb5("hint","🤔 Chaque action mise en place doit être évaluée — et si une action ne s'y prête pas, on évalue l'atteinte de l'objectif. Cette évaluation mesure bien quelque chose que vous avez posé…");
      }else{
        fb5("okk","Cette évaluation est nécessaire au suivi — nous la gardons. Reliez-la maintenant.");
        setTimeout(()=>{p5.phase="lien";RENDER.acte5()},1600);
      }
    }
  }else{
    if(oui){
      state.piegeSelect5++;state.flags.add("evallink");
      fb5("err","🎭 "+e.msg);
      setTimeout(nextEval5,2600);
    }else{
      toast("👍 Bien écarté : elle ne mesurait rien de votre projet.");
      nextEval5();
    }
  }
}
function repLien5(v,btn){
  const p5=state.p5,k=p5.probs[p5.idx],P=PROJET[k];
  const ei=p5[k+"_evalOrder"][p5.ei], e=P.evals[ei];
  const val=v==="obj"?"obj":parseInt(v,10);
  const liens=e.links||[];
  const liensDispo=liens.filter(l=>l==="obj"||p5.chosen[k].actions.includes(l));
  const valide=liensDispo.length?liensDispo.some(l=>String(l)===String(val)):(val==="obj");
  if(valide){
    btn.classList.add("juste");
    p5.chosen[k].evals.push({i:ei,lien:val});
    paintMini5();
    setTimeout(nextEval5,600);
  }else{
    state.evalErr++;state.flags.add("evallink");
    btn.classList.add("faux");btn.disabled=true;
    fb5("hint","🤔 Pas tout à fait : que mesure-t-elle <b>directement</b> ? Relisez l'évaluation et vos actions…");
  }
}
function nextEval5(){
  const p5=state.p5,k=p5.probs[p5.idx],P=PROJET[k];
  p5.ei++;
  if(p5.ei>=P.evals.length){
    p5.idx++;p5.phase="obj";p5.ai=0;p5.ei=0;
    if(p5.idx<p5.probs.length)toast("✅ "+P.titre+" : projet posé ! Problème suivant.");
  }
  RENDER.acte5();
}
function finActe5(){
  state.stars.a5=state.piegeSelect5===0?3:(state.piegeSelect5<=2?2:1);
  const a6err=state.relances+state.evalErr;
  state.stars.a6=a6err===0?3:(a6err<=2?2:1);
  modal("🎉 Projet de soins validé !","Votre démarche clinique est complète : recueil, analyse, conclusion justifiée, projet réaliste et évaluable. Découvrez votre bilan personnalisé.",
  [{t:"Voir mon bilan →",fn:()=>go("bilan")}]);
}


/* ---------- TRACE ÉCRITE : le corrigé personnel de l'élève ---------- */
function renderTrace(){
  // 1. Recueil de données : entretien avec M. Marcel + dossier
  const entretien=[], dossier=[];
  [...state.chips].forEach(c=>{
    const estDossier=CLASSEUR.some(r=>r.items.includes(c)) && !SCENES.patient.questions.some(q=>q.chip===c||( q.chip2&&q.chip2.includes(c)));
    if(estDossier)dossier.push(c); else entretien.push(c);
  });
  const recueil=
    (entretien.length?'<p style="margin:8px 0 2px"><b>Auprès de M. Marcel (entretien et observation) :</b></p><ul class="trace-ul">'+entretien.map(c=>'<li>'+esc(CHIPS[c].t)+'</li>').join("")+'</ul>':"")+
    (dossier.length?'<p style="margin:8px 0 2px"><b>Dans le dossier patient :</b></p><ul class="trace-ul">'+dossier.map(c=>'<li>'+esc(CHIPS[c].t)+'</li>').join("")+'</ul>':"");

  // 2. Tableau des 14 besoins fondamentaux

    BESOINS.map(b=>{
      const t=state.hTable[b.id]||{S:[],NS:[]};
      const vide=!t.S.length&&!t.NS.length;
      return '<tr><td><b>'+esc(b.nom)+'</b></td>'+
      (vide?'<td colspan="2" style="font-style:italic;color:var(--encre2)">— aucune donnée recueillie ce jour —</td>':
      '<td>'+t.S.map(c=>esc(CHIPS[c].t)).join("<br>")+'</td><td>'+t.NS.map(c=>esc(CHIPS[c].t)).join("<br>")+'</td>')+'</tr>';
    }).join("")+'</tbody></table>';

  // 3. Conclusion clinique littérale
  const concl='<ul class="trace-ul">'+state.validated.map(id=>{
    const p=PROB3[id];
    return '<li><b>'+esc(p.intitule)+'</b> lié(e) à '+esc(p.causes.map(c=>c.ok).join(", "))+
    (p.manifs.length?", se manifestant par "+esc(p.manifs.map(m=>m.ok).join(", ")):"")+'.</li>';
  }).join("")+'</ul>';

  // 4. Projet de soins sous forme de tableau
  const ps='<table class="trace-table"><thead><tr><th>Problème / Risque</th><th>Objectif</th><th>Actions (à ce jour)</th><th>Évaluations</th></tr></thead><tbody>'+
    (state.p5?state.p5.probs:[]).map(k=>{
      const P=PROJET[k],C=state.p5.chosen[k];
      return '<tr><td><b>'+esc(P.titre)+'</b></td>'+
      '<td>'+(C.obj!==null?esc(P.objs[C.obj].t):"")+'</td>'+
      '<td><ul class="trace-ul">'+C.actions.map(ai=>'<li>'+esc(P.actions[ai].t)+'</li>').join("")+'</ul></td>'+
      '<td><ul class="trace-ul">'+C.evals.map(ev=>'<li>'+esc(P.evals[ev.i].t)+'<br><i style="font-size:.78em;color:var(--encre2)">→ évalue : '+esc(ev.lien==="obj"?"l\'atteinte de l\'objectif":P.actions[ev.lien].t)+'</i></li>').join("")+'</ul></td></tr>';
    }).join("")+'</tbody></table>';

  return '<h3 style="margin:30px 0 4px">📝 Ma trace écrite — la démarche clinique de M. Marcel</h3>'+
  '<p style="color:var(--encre2);font-size:.9rem;margin-bottom:12px">Voici, mise au propre, la démarche que vous venez de construire — votre propre corrigé, à conserver et à relire.</p>'+
  '<div class="card trace">'+
  '<h4 class="trace-h">1 · Recueil de données</h4>'+
  '<p style="font-size:.92rem">M. Marcel, 99 ans, ancien contremaître dans une filature, est entré à l\'EHPAD le 15 juin 2026 à la suite de deux chutes à domicile en trois semaines, à la demande de sa fille.</p>'+recueil+
  '<h4 class="trace-h">2 · Les 14 besoins fondamentaux (Virginia Henderson)</h4>'+vh+
  '<h4 class="trace-h">3 · Conclusion clinique</h4>'+concl+
  '<h4 class="trace-h">4 · Projet de soins</h4>'+ps+
  '</div>';
}

/* ---------- BILAN FINAL ---------- */
function calcBadges(){
  const earned=new Set();
  if(jaugePct()>=100)earned.add("limier");
  if(state.errH===0)earned.add("henderson");
  if(state.wrong3===0)earned.add("reflexif");
  if(state.secondChances===0)earned.add("justif");
  if(state.linkFails===0)earned.add("liens");
  if(state.chips.has("PROMESSE")&&state.ecouteYes)earned.add("promesse");
  if(state.maltYes===0)earned.add("bientraitance");
  earned.add("diplome");
  return earned;
}
function stars(n){return '<span class="stars">'+"★".repeat(n)+'<span style="opacity:.25">'+"★".repeat(3-n)+'</span></span>'}
RENDER.bilan=function(){
  const earned=calcBadges();
  const nbB=earned.size;
  const totalStars=Object.values(state.stars).reduce((a,b)=>a+b,0);
  const suggs=[...state.flags].filter(f=>SUGGESTIONS[f]);
  app.innerHTML=
  '<div id="scr-bilan">'+
  '<p class="eyebrow">Bilan de fin de parcours</p>'+
  '<h2 class="acte-title">Votre démarche clinique, en un coup d\'œil</h2>'+
  '<p class="acte-sub">M. Marcel est entre de bonnes mains. Voici la trace de votre raisonnement — à discuter avec votre formateur, ou à battre lors d\'une prochaine partie !</p>'+
  '<div class="card" style="display:flex;gap:26px;align-items:center;flex-wrap:wrap"><div><div style="font-size:2.6rem;font-weight:800" class="disp">'+totalStars+'<span style="font-size:1.2rem;color:var(--encre2)"> / 18 ⭐</span></div><div style="color:var(--encre2);font-weight:700">'+nbB+' badge'+(nbB>1?"s":"")+' sur '+BADGES.length+'</div></div>'+
  '<div style="flex:1;min-width:240px;display:grid;gap:8px">'+
  [["Acte 1 · Recueil de données","a1"],["Acte 2 · Les 14 besoins","a2"],["Acte 3 · Conclusion clinique","a3"],["Acte 4 · Justification","a4"],["Acte 5 · Projet de soins","a5"],["Acte 6 · Cohérence actions-évaluations","a6"]].map(x=>
    '<div class="acte-recap"><b>'+x[0]+'</b>'+stars(state.stars[x[1]])+'</div>').join("")+
  '</div></div>'+
  '<h3 style="margin:22px 0 4px">🏅 Vos badges</h3>'+
  '<div class="badge-grid">'+BADGES.map(b=>
    '<div class="badge'+(earned.has(b.id)?"":" off")+'"><div class="ic">'+b.ic+'</div><h5>'+b.nom+'</h5><p>'+b.desc+'</p></div>').join("")+'</div>'+
  '<h3 style="margin:26px 0 4px">📚 Vos pistes de révision personnalisées</h3>'+
  (suggs.length?
    suggs.map(f=>'<div class="sugg">'+SUGGESTIONS[f]+'</div>').join(""):
    '<div class="sugg" style="background:var(--vert-p);border-color:var(--vert)">Rien à signaler : votre raisonnement a été solide de bout en bout. Bravo — et rendez-vous en stage ! 👏</div>')+
  renderTrace()+
  '<div class="footer-nav" style="margin-top:28px"><button class="btn sec" onclick="window.print()">🖨️ Imprimer mon bilan et ma trace écrite</button>'+
  '<button class="btn warn" onclick="modal(\'Recommencer ?\',\'Toute votre progression sera définitivement effacée. Une nouvelle partie commencera de zéro.\',[{t:\'Annuler\',sec:true},{t:\'Tout effacer et recommencer\',fn:()=>location.reload()}])">↻ Recommencer (tout effacer)</button></div>'+
  '</div>';
};

/* ---------- MODE DÉMONSTRATION (formateur) ---------- */
function askGod(){
  if(state.god){state.god=false;paintGodBar();toast("Mode démonstration désactivé.");return}
  const root=$("#modalRoot");
  root.innerHTML='<div class="modal-bg"><div class="modal"><h3>Mode démonstration</h3><p>Entrez le code formateur :</p><input type="password" id="godCode" autocomplete="off" style="width:100%;padding:11px;border:1.5px solid var(--ligne);border-radius:10px;font-size:1rem;margin-bottom:14px"><div class="m-actions"><button class="btn sec" onclick="document.getElementById(\'modalRoot\').innerHTML=\'\'">Annuler</button><button class="btn" onclick="checkGod()">Valider</button></div></div></div>';
  setTimeout(()=>{const i=$("#godCode");if(i){i.focus();i.onkeydown=e=>{if(e.key==="Enter")checkGod()}}},60);
}
function checkGod(){
  const v=($("#godCode")||{}).value||"";
  $("#modalRoot").innerHTML="";
  if(v==="JesuisDieu"){state.god=true;paintGodBar();toast("🔓 Mode démonstration activé : naviguez librement entre les actes.");}
  else toast("Code incorrect.");
}
function paintGodBar(){
  let bar=document.getElementById("godBar");
  if(!state.god){if(bar)bar.remove();return}
  if(!bar){bar=document.createElement("div");bar.id="godBar";document.body.insertBefore(bar,document.querySelector("main"));}
  const items=[["accueil","Accueil"],["acte1","Acte 1"],["acte2","Acte 2"],["acte3","Acte 3"],["acte4","Acte 4"],["acte5","Acte 5"],["bilan","Bilan"]];
  bar.innerHTML='<span class="god-lbl">🔓 Démo formateur</span>'+items.map(x=>'<button class="god-btn'+(state.ecran===x[0]?" on":"")+'" onclick="godJump(\''+x[0]+'\')">'+x[1]+'</button>').join("")+'<button class="god-btn quit" onclick="state.god=false;paintGodBar();toast(\'Mode démonstration désactivé.\')">✕ Quitter</button>';
}
function resetForGod(){
  state.chips=new Set();state.asked=new Set();state.unlocked=new Set();state.visited=new Set();state.sc={};
  state.errH=0;state.hTable={};state.hPlaced={};state.h=null;
  state.validated=[];state.wrong3=0;state.piegesUsed=new Set();state.c3=null;state._bonusMode=false;
  state.quizQueue=[];state.quizIdx=0;state.quizAttempt=0;state.secondChances=0;state.linkFails=0;
  state.p5=null;state.piegeSelect5=0;state.relances=0;state.evalErr=0;state.maltYes=0;state.ecouteYes=false;
  state.flags=new Set();state.stars={a1:0,a2:0,a3:0,a4:0,a5:0,a6:0};
  refreshCarnet();
}
function seedRecueil(){
  Object.entries(CHIPS).forEach(([id,c])=>{if(c.crucial)state.chips.add(id)});
  state.stars.a1=3;refreshCarnet();
}
function seedHenderson(){
  initActe2();
  state.h2.queue.forEach(chip=>{
    const card=CARDS2[chip];
    const bon=card.options.find(o=>o.ok);
    if(bon.besoin!=="__NA__")state.hTable[bon.besoin][card.col].push(chip);
  });
  state.h2.idx=state.h2.queue.length;state.stars.a2=3;
}
function seedConclusion(){
  initActe3();
  Object.keys(PROB3).forEach(id=>{state.validated.push(id);state.c3.doneG.add(PROB3[id].groupe)});
  state.stars.a3=3;
}
function seedProjet(){
  initActe5();
  state.p5.probs.forEach(k=>{
    const P=PROJET[k],C=state.p5.chosen[k];
    C.obj=P.objs.findIndex(o=>o.ok);
    P.actions.forEach((a,i)=>{if(a.ok){C.actions.push(i);if(a.ecoute)state.ecouteYes=true}});
    P.evals.forEach((e,i)=>{if(e.ok){const l=(e.links||[]).find(x=>x==="obj"||C.actions.includes(x));C.evals.push({i:i,lien:l===undefined?"obj":l})}});
  });
  state.p5.idx=state.p5.probs.length;
  state.stars.a5=3;state.stars.a6=3;
}
function godJump(target){
  resetForGod();
  if(target==="accueil"){go("accueil");paintGodBar();return}
  if(target==="acte1"){go("acte1");paintGodBar();return}
  seedRecueil();
  if(target==="acte2"){initActe2();go("acte2");paintGodBar();return}
  seedHenderson();
  if(target==="acte3"){go("acte3");paintGodBar();return}
  seedConclusion();
  if(target==="acte4"){go("acte4prep");paintGodBar();return}
  state.stars.a4=3;
  if(target==="acte5"){initActe5();go("acte5");paintGodBar();return}
  seedProjet();go("bilan");paintGodBar();
}


/* ---------- Lancement ---------- */
renderSteps();
RENDER.accueil();
state.god = true; /* démo : godmode forcé */
paintGodBar();

/* ---------- SCORM : remontée du score au LMS à l'affichage du bilan ---------- */
(function(){
  const _bilanOriginal = RENDER.bilan;
  RENDER.bilan = function(){
    _bilanOriginal();
    try{
      const total = Object.values(state.stars).reduce((a,b)=>a+b,0);
      if (typeof SCORM !== "undefined") SCORM.rapporter(total, 18);
    }catch(e){}
  };
})();
</script>
