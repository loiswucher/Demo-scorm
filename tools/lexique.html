<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Lexique — construire les mots du soin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#22383F; --ground2:#2C4750; --ground3:#1A2C32;
  --card:#E2D9C3; --card2:#D3C8AE; --cardEdge:#B8AB8C;
  --ink:#262119; --ink2:#5C5346; --inkFaint:#8C8271;
  --amber:#E0A32E; --amberDeep:#B87F14;
  --ok:#4E9E7E; --bad:#C25742;
  --paper:#F0EADC;
  --disp:'Zilla Slab',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--paper);
  background:var(--ground);
  background-image:radial-gradient(ellipse at 50% -10%, #31505A 0%, var(--ground) 55%, var(--ground3) 100%);
  background-attachment:fixed;
  min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---------- CHROME ---------- */
header{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;
  background:rgba(26,44,50,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(226,217,195,.16);
}
.logo{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.logo span{color:var(--amber)}
.compteur{
  font-family:var(--mono);font-size:12px;color:#B9C7CB;
  display:flex;align-items:center;gap:8px;margin-left:auto;white-space:nowrap;
}
.jauge{width:110px;height:5px;background:rgba(226,217,195,.18);border-radius:3px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--amber);width:0;transition:width .5s}
.navbtn{
  font-size:13px;font-weight:600;padding:7px 13px;border-radius:7px;
  border:1px solid rgba(226,217,195,.28);color:#DCE5E7;transition:.15s;
}
.navbtn:hover{background:rgba(226,217,195,.12)}
.navbtn.on{background:var(--card);color:var(--ink);border-color:var(--card)}
main{max-width:880px;margin:0 auto;padding:26px 18px 90px}

/* ---------- ACCUEIL ---------- */
.hero{text-align:center;padding:26px 0 34px}
.hero h1{font-family:var(--disp);font-size:clamp(30px,5.4vw,46px);font-weight:700;line-height:1.1}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{color:#B9C7CB;margin-top:12px;font-size:16px;max-width:520px;margin-inline:auto}
.demo{
  display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:24px;font-family:var(--mono);font-size:15px;
}
.demo .t{padding:7px 12px;border-radius:6px;background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 2px 0 var(--cardEdge)}
.demo .t.hl{background:var(--amber);box-shadow:0 2px 0 var(--amberDeep);animation:pulse 2.4s ease-in-out infinite}
.demo .op{color:#8FA3A9;font-weight:600}
.demo .res{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--paper)}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.niveaux{display:grid;gap:11px;margin-top:34px}
.niv{
  display:flex;align-items:center;gap:16px;text-align:left;width:100%;
  padding:15px 18px;border-radius:11px;
  background:var(--card);color:var(--ink);
  box-shadow:0 3px 0 var(--cardEdge);transition:.15s;
}
.niv:hover:not(.lock){transform:translateY(-2px);box-shadow:0 5px 0 var(--cardEdge)}
.niv.lock{background:rgba(226,217,195,.09);color:#8FA3A9;box-shadow:none;cursor:not-allowed;border:1px dashed rgba(226,217,195,.24)}
.niv .num{
  font-family:var(--mono);font-weight:600;font-size:13px;
  width:32px;height:32px;flex:none;border-radius:8px;
  display:grid;place-items:center;background:var(--ground);color:var(--card);
}
.niv.lock .num{background:rgba(226,217,195,.14);color:#8FA3A9}
.niv .txt{flex:1;min-width:0}
.niv .txt b{font-family:var(--disp);font-size:17px;display:block}
.niv .txt small{font-size:13px;color:var(--ink2);display:block;margin-top:1px}
.niv.lock .txt small{color:#7C8F95}
.niv .etat{font-family:var(--mono);font-size:12px;color:var(--ink2);flex:none;text-align:right}
.niv.lock .etat{color:#7C8F95}
.niv .etat b{display:block;color:var(--ok);font-family:var(--sans);font-size:12px}

/* ---------- FICHE (exercice) ---------- */
.fiche{
  background:var(--card);color:var(--ink);border-radius:13px;
  padding:26px 24px;box-shadow:0 5px 0 var(--cardEdge);
  position:relative;overflow:hidden;
}
.fiche::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--sysCol,var(--ground))}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--inkFaint);font-weight:600;margin-bottom:12px;
}
.consigne{font-family:var(--disp);font-size:15px;color:var(--ink2);margin-bottom:6px}
.cible{font-family:var(--disp);font-size:clamp(21px,3.6vw,27px);font-weight:600;line-height:1.28}
.motcible{font-family:var(--disp);font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.01em}

.rappel{
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  background:rgba(224,163,46,.17);border:1px solid rgba(224,163,46,.5);
  border-radius:9px;padding:11px 14px;margin-bottom:18px;font-size:14px;
}
.rappel .glow{
  font-family:var(--mono);font-weight:600;padding:5px 10px;border-radius:6px;
  background:var(--amber);color:var(--ink);box-shadow:0 0 0 0 rgba(224,163,46,.7);
  animation:halo 1.8s ease-out 2;
}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(224,163,46,.75)}100%{box-shadow:0 0 0 16px rgba(224,163,46,0)}}

.slots{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 6px;min-height:60px;align-items:center}
.slot{
  min-width:104px;height:58px;border-radius:9px;
  border:2px dashed var(--cardEdge);background:rgba(38,33,25,.045);
  display:grid;place-items:center;transition:.14s;
}
.slot.plein{border-style:solid;border-color:transparent;background:none;padding:0}
.slot.fixe{border-style:solid;border-color:var(--cardEdge);background:rgba(38,33,25,.09)}
.slot.fixe span{font-family:var(--mono);font-size:13px;color:var(--inkFaint)}
.plus{font-family:var(--mono);font-weight:600;color:var(--inkFaint);font-size:17px}

.tuile{
  font-family:var(--mono);text-align:center;line-height:1.2;
  padding:9px 13px;border-radius:8px;min-width:104px;height:58px;
  background:var(--paper);color:var(--ink);
  box-shadow:0 3px 0 var(--cardEdge);border:1px solid var(--cardEdge);
  display:flex;flex-direction:column;justify-content:center;gap:2px;transition:.12s;
}
.tuile b{font-size:15px;font-weight:600;display:block}
.tuile small{font-size:10.5px;color:var(--ink2);font-family:var(--sans);display:block;line-height:1.15}
.tuile:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--cardEdge)}
.tuile:active{transform:translateY(1px);box-shadow:0 1px 0 var(--cardEdge)}
.tuile.sel{background:var(--ground);color:var(--card);border-color:var(--ground3);box-shadow:0 3px 0 var(--ground3)}
.tuile.sel small{color:#A9BCC2}
.tuile.cle{background:var(--amber);border-color:var(--amberDeep);box-shadow:0 3px 0 var(--amberDeep)}
.tuile.faux{animation:shake .35s}
.tuile.ghost{opacity:.28;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.banque{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--cardEdge)}
.banque .lbl{width:100%;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--inkFaint);margin-bottom:2px}

.choix{display:grid;gap:9px;margin-top:20px}
.opt{
  text-align:left;padding:13px 15px;border-radius:9px;
  background:var(--paper);border:1px solid var(--cardEdge);color:var(--ink);
  box-shadow:0 2px 0 var(--cardEdge);transition:.12s;font-size:15px;
}
.opt:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--cardEdge)}
.opt.bon{background:#D6EBE0;border-color:var(--ok);box-shadow:0 2px 0 var(--ok)}
.opt.mauvais{background:#F0D9D3;border-color:var(--bad);box-shadow:0 2px 0 var(--bad)}

.actions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.btn{
  font-weight:600;font-size:15px;padding:12px 22px;border-radius:9px;
  background:var(--ground);color:var(--card);box-shadow:0 3px 0 var(--ground3);transition:.12s;
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 var(--ground3)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:0 3px 0 var(--ground3)}
.btn.or{background:var(--amber);color:var(--ink);box-shadow:0 3px 0 var(--amberDeep)}
.btn.or:hover{box-shadow:0 5px 0 var(--amberDeep)}
.btn.ghost{background:none;color:var(--ink2);box-shadow:none;border:1px solid var(--cardEdge)}
.btn.ghost:hover{background:rgba(38,33,25,.06);transform:none;box-shadow:none}

.msg{font-size:14px;font-weight:600;margin-left:auto}
.msg.ko{color:var(--bad)}
.msg.ok{color:var(--ok)}

/* ---------- REVELATION ---------- */
.reveal{animation:pop .3s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.sysTag{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:20px;background:var(--sysCol,var(--ground));color:#fff;margin-bottom:12px;
}
.decomp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.definition{
  font-size:16px;line-height:1.55;padding:15px 17px;border-radius:9px;
  background:var(--paper);border-left:4px solid var(--sysCol,var(--ground));
}
.indice{margin-top:12px;font-size:14px;color:var(--ink2);font-style:italic}
.ajout{
  margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--ok);font-weight:600;
  display:flex;align-items:center;gap:6px;
}

/* ---------- LEXIQUE ---------- */
.tiroir{margin-bottom:14px;background:var(--card);border-radius:11px;overflow:hidden;box-shadow:0 3px 0 var(--cardEdge)}
.tiroirTete{
  display:flex;align-items:center;gap:12px;width:100%;padding:14px 17px;color:var(--ink);text-align:left;
}
.tiroirTete:hover{background:var(--card2)}
.tiroirTete .ic{font-size:19px}
.tiroirTete b{font-family:var(--disp);font-size:16px;flex:1}
.tiroirTete .cpt{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.tiroirTete .bg{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;
  background:rgba(38,33,25,.12);color:var(--inkFaint);
}
.tiroirTete .bg.won{background:var(--amber);color:var(--ink)}
.barre{height:4px;background:rgba(38,33,25,.13)}
.barre i{display:block;height:100%;background:var(--sysCol);transition:width .4s}
.corps{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;padding:14px 17px 17px}
.mc{
  padding:9px 11px;border-radius:8px;background:var(--paper);border:1px solid var(--cardEdge);
  text-align:left;color:var(--ink);transition:.12s;
}
.mc:hover{transform:translateY(-1px)}
.mc b{font-family:var(--disp);font-size:14.5px;display:block}
.mc small{font-size:11px;color:var(--ink2);font-family:var(--mono)}
.mc.vide{background:rgba(38,33,25,.05);border-style:dashed;color:var(--inkFaint)}
.mc.vide b{font-family:var(--mono);letter-spacing:.13em;font-weight:500;font-size:13px}

/* ---------- BADGES ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
.bd{
  background:var(--card);border-radius:11px;padding:17px 12px;text-align:center;color:var(--ink);
  box-shadow:0 3px 0 var(--cardEdge);
}
.bd .ic{font-size:31px;display:block;filter:grayscale(1);opacity:.3}
.bd.won{background:var(--amber);box-shadow:0 3px 0 var(--amberDeep)}
.bd.won .ic{filter:none;opacity:1}
.bd b{display:block;font-family:var(--disp);font-size:13.5px;margin-top:8px;line-height:1.25}
.bd small{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.bd.grand{grid-column:1/-1;background:var(--ground);color:var(--card);box-shadow:0 3px 0 var(--ground3)}
.bd.grand small{color:#A9BCC2}
.bd.grand.won{background:var(--amber);color:var(--ink);box-shadow:0 3px 0 var(--amberDeep)}
.bd.grand.won small{color:var(--ink2)}

/* ---------- DIVERS ---------- */
.h2{font-family:var(--disp);font-size:23px;font-weight:700;margin:6px 0 16px}
.sub{color:#B9C7CB;font-size:14px;margin-bottom:20px}
.retour{font-size:13.5px;color:#B9C7CB;margin-bottom:16px;display:inline-flex;gap:6px;align-items:center}
.retour:hover{color:var(--paper)}
.progress{font-family:var(--mono);font-size:12px;color:#8FA3A9;margin-bottom:12px}
.fin{text-align:center;padding:34px 22px}
.fin .big{font-family:var(--disp);font-size:30px;font-weight:700;margin-bottom:8px}
.transmission{
  background:var(--paper);border-radius:9px;padding:17px;font-size:15.5px;line-height:1.7;
  border-left:4px solid var(--ground);margin:16px 0;color:var(--ink);
}
.transmission b{
  font-weight:600;background:rgba(224,163,46,.3);padding:1px 5px;border-radius:4px;cursor:pointer;
  border-bottom:2px solid var(--amber);
}
.transmission b:hover{background:var(--amber)}
.transmission b.done{background:#D6EBE0;border-color:var(--ok);cursor:default}
.transmission b.rate{background:#F0D9D3;border-color:var(--bad)}
.formLink{
  position:fixed;bottom:9px;right:11px;font-family:var(--mono);font-size:10px;
  color:rgba(226,217,195,.22);z-index:50;
}
.formLink:hover{color:rgba(226,217,195,.6)}
.formBar{
  background:var(--amber);color:var(--ink);text-align:center;padding:5px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;
}
@media (max-width:560px){
  main{padding:20px 13px 80px}
  .tuile,.slot{min-width:88px;height:54px}
  .compteur .jauge{display:none}
  .niv{padding:13px 14px;gap:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="formBar"></div>
<header>
  <div class="logo">Le <span>Lexique</span></div>
  <button class="navbtn" id="nAccueil">Niveaux</button>
  <button class="navbtn" id="nLex">Lexique</button>
  <button class="navbtn" id="nBadges">Badges</button>
  <div class="compteur"><span id="cpt">0 / 0</span><span class="jauge"><i id="jauge"></i></span></div>
</header>
<main id="app"></main>
<button class="formLink" id="formLink">·</button>
<script>
/* ================= CORPUS ÉTYMOLOGIQUE — AS 2021 =================
   E = éléments (préfixes / racines / suffixes)
   P = mots-passerelles (langue courante) -> duo
   M = mots médicaux (lexique + badges)
   Niveau d'un mot = max(niveau de ses éléments) -> garantit qu'aucun mot
   n'apparaît avant que toutes ses briques soient connues.
================================================================== */

const SYSTEMES = {
  neuro:      { nom: "Neurologie",              icone: "🧠", couleur: "#7C5CFF" },
  cardio:     { nom: "Cardio-vasculaire",       icone: "❤️", couleur: "#E5484D" },
  respi:      { nom: "Respiratoire & ORL",     icone: "🫁", couleur: "#3E9DD8" },
  digestif:   { nom: "Digestif & Nutrition",    icone: "🍽️", couleur: "#E8A33D" },
  urinaire:   { nom: "Urinaire & Rénal",        icone: "💧", couleur: "#2FB6A8" },
  loco:       { nom: "Locomoteur",              icone: "🦴", couleur: "#9C8B72" },
  peau:       { nom: "Peau & Téguments",        icone: "🩹", couleur: "#EE8F7A" },
  sang:       { nom: "Sang & Cancérologie",     icone: "🩸", couleur: "#B23A48" },
  infect:     { nom: "Infectieux & Hygiène",    icone: "🦠", couleur: "#5FA855" },
  endo:       { nom: "Endocrinien & Métabolisme", icone: "⚖️", couleur: "#C77DBB" },
  mental:     { nom: "Santé mentale",           icone: "💭", couleur: "#6B8FBF" }
};

const NIVEAUX = [
  { n:1, titre:"Vous savez déjà",        sous:"Six mots que vous connaissez. Et six que vous croyiez ne pas connaître." },
  { n:2, titre:"Les organes",            sous:"Nommer ce qu'il y a dedans : cœur, foie, rein, vessie, côlon, bronche…" },
  { n:3, titre:"Tissus, sang & couleurs",sous:"L'os, le muscle, la peau, le sang, le sucre, la chaleur. Et le rouge, le bleu, le noir." },
  { n:4, titre:"Ce qui ne va pas",       sous:"Les suffixes de la maladie : inflammation, douleur, écoulement, volume." },
  { n:5, titre:"Ce qu'on fait au patient", sous:"Les suffixes des actes : regarder, enregistrer, couper, aboucher." },
  { n:6, titre:"Trop, ou pas assez",     sous:"Les préfixes de quantité. Le cœur de la surveillance AS." },
  { n:7, titre:"Où ça ?",                sous:"Les préfixes de position. Autour, dedans, dessous, à travers." },
  { n:8, titre:"L'invisible",            sous:"Germes, tumeurs, humeurs. Le vocabulaire du dossier et de l'hygiène." },
  { n:9, titre:"Terrain",                sous:"Des mots que vous n'avez jamais vus. Décodez-les seuls, puis lisez de vraies transmissions." }
];

/* ---------------- ÉLÉMENTS ---------------- */
/* type: pre | rac | suf   |   pass: passerelle (mot courant) ou null */
const E = [
/* ===== NIVEAU 1 ===== */
{id:"hemi",   f:"hémi",    t:"pre", sens:"la moitié",                        niv:1, pass:"hemisphere"},
{id:"plegie", f:"plégie",  t:"suf", sens:"paralysie",                        niv:1, pass:"paraplegie"},
{id:"pneum",  f:"pneum(o)",t:"rac", sens:"l'air, le poumon",                 niv:1, pass:"pneu"},
{id:"pathie", f:"pathie",  t:"suf", sens:"la maladie, la souffrance",        niv:1, pass:"telepathie"},
{id:"algie",  f:"algie",   t:"suf", sens:"la douleur",                       niv:1, pass:"antalgique"},
{id:"gastr",  f:"gastr(o)",t:"rac", sens:"l'estomac, le ventre",             niv:1, pass:"gastronomie"},
{id:"cardi",  f:"cardi(o)",t:"rac", sens:"le cœur",                          niv:1, pass:"cardio"},
{id:"tachy",  f:"tachy",   t:"pre", sens:"rapide, accéléré",                 niv:1, pass:"tachymetre"},
{id:"neur",   f:"neur/névr",t:"rac",sens:"le nerf",                          niv:1, pass:"neurone"},
{id:"ite",    f:"ite",     t:"suf", sens:"inflammation",                     niv:1, pass:"bronchite"},

/* ===== NIVEAU 2 — racines ===== */
{id:"hepat",  f:"hépat(o)", t:"rac", sens:"le foie",                         niv:2, pass:"hepatite"},
{id:"nephr",  f:"néphr(o)", t:"rac", sens:"le rein",                         niv:2, pass:null},
{id:"ur",     f:"ur(o)",    t:"rac", sens:"l'urine, l'urée",                 niv:2, pass:null},
{id:"por",    f:"por(o)",   t:"rac", sens:"le pore, le petit trou",           niv:3, pass:"pore"},
{id:"electro",f:"électro",  t:"rac", sens:"l'électricité",                    niv:6, pass:"electricien"},
{id:"cyst",   f:"cyst(o)",  t:"rac", sens:"la vessie",                       niv:2, pass:"cystite"},
{id:"oste",   f:"osté(o)",  t:"rac", sens:"l'os",                            niv:3, pass:"osteopathe"},
{id:"arthr",  f:"arthr(o)", t:"rac", sens:"l'articulation",                  niv:3, pass:"arthropode"},
{id:"my",     f:"my(o)",    t:"rac", sens:"le muscle",                       niv:3, pass:"myopathie_telethon"},
{id:"tendin", f:"tendin",   t:"rac", sens:"le tendon",                       niv:3, pass:null},
{id:"derm",   f:"derm(ato)",t:"rac", sens:"la peau",                         niv:3, pass:"dermatologue"},

/* ---------------------------------------------------------------
   SCORM 1.2 — cmi.suspend_data est plafonné à 4096 caractères.
   Un état JSON ferait ~5 000 caractères : il serait tronqué par le LMS
   et la progression serait silencieusement perdue.
   On encode donc l'état en binaire compacté : ~95 caractères.
   Ordre des bits (dépend de l'ordre des tableaux MOTS et E, figés) :
     [156 bits] mots trouvés   [126 bits] briques vues
     [252 bits] maîtrise (2 bits/brique, 0-3)
     [4 bits] niveau max   [9 bits] niveaux parcourus   [1 bit] mode formateur
--------------------------------------------------------------- */
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-";
const VERSION_SAUVEGARDE = '2';
function encoderEtat() {
  const b = [];
  MOTS.forEach(w => b.push(estTrouve(w.m) ? 1 : 0));
  E.forEach(x => b.push(estVu(x.id) ? 1 : 0));
  E.forEach(x => { const m = mait(x.id); b.push((m >> 1) & 1, m & 1); });
  for (let i = 3; i >= 0; i--) b.push((S.nivMax >> i) & 1);
  for (let n = 1; n <= 9; n++) b.push(S.nivFaits.includes(n) ? 1 : 0);
  b.push(S.form ? 1 : 0);
  let s = '';
  for (let i = 0; i < b.length; i += 6) {
    let v = 0; for (let j = 0; j < 6; j++) v = (v << 1) | (b[i + j] || 0);
    s += B64[v];
  }
  return VERSION_SAUVEGARDE + s;
}
function decoderEtat(str) {
  if (!str || str[0] !== VERSION_SAUVEGARDE) return false;   /* corpus modifié : on repart proprement */
  const b = [];
  for (const ch of str.slice(1)) {
    const v = B64.indexOf(ch); if (v < 0) return false;
    for (let j = 5; j >= 0; j--) b.push((v >> j) & 1);
  }
  const n = { ...JSON.parse(JSON.stringify(VIDE)) };
  let p = 0;
  MOTS.forEach(w => { if (b[p++]) n.trouves.push(w.m); });
  E.forEach(x => { if (b[p++]) n.vus.push(x.id); });
  E.forEach(x => { const m = (b[p++] << 1) | b[p++]; if (m) n.maitrise[x.id] = m; });
  let nm = 0; for (let i = 0; i < 4; i++) nm = (nm << 1) | b[p++];
  n.nivMax = Math.max(1, nm);
  for (let k = 1; k <= 9; k++) if (b[p++]) n.nivFaits.push(k);
  n.form = !!b[p++];
  S = n; return true;
}

/* --- pont SCORM 1.2 --- */
let API = null, scormOk = false, tDebut = Date.now();
function chercherAPI(win, prof) {
  let i = 0;
  while (win && !win.API && win.parent && win.parent !== win && i < (prof || 10)) { i++; win = win.parent; }
  return win ? win.API : null;
}
function initScorm() {
  try {
    API = chercherAPI(window) || (window.opener ? chercherAPI(window.opener) : null);
    if (!API) return false;
    if (API.LMSInitialize("") !== "true") return false;
    scormOk = true;
    if ((API.LMSGetValue("cmi.core.lesson_status") || "") === "not attempted")
      API.LMSSetValue("cmi.core.lesson_status", "incomplete");
    API.LMSSetValue("cmi.core.score.min", "0");
    API.LMSSetValue("cmi.core.score.max", "100");
    return true;
  } catch (e) { return false; }
}
function chrono() {
  const s = Math.floor((Date.now() - tDebut) / 1000);
  const p = v => String(v).padStart(2, '0');
  return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
}
function pousserScorm(finir) {
  if (!scormOk) return;
  try {
    API.LMSSetValue("cmi.suspend_data", encoderEtat());
    API.LMSSetValue("cmi.core.score.raw", String(Math.round(100 * S.trouves.length / TOTAL)));
    /* TERMINÉ = les 9 niveaux parcourus */
    API.LMSSetValue("cmi.core.lesson_status", S.nivFaits.length >= NIV_MAX ? "completed" : "incomplete");
    API.LMSSetValue("cmi.core.session_time", chrono());
    API.LMSSetValue("cmi.core.exit", finir ? "" : "suspend");
    API.LMSCommit("");
    if (finir) { API.LMSFinish(""); scormOk = false; }
  } catch (e) { }
}

function charger() {
  if (initScorm()) {
    const d = API.LMSGetValue("cmi.suspend_data");
    if (d && decoderEtat(d)) return;
    return;                                   /* première ouverture : état vierge */
  }
  try { const r = localStorage.getItem(CLE); if (r) S = Object.assign({ ...VIDE }, JSON.parse(r)); } catch (e) { }
}
function sauver() {
  if (scormOk) { pousserScorm(false); return; }
  try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) { }
}
function raz() {
  if (!confirm("Effacer toute la progression ? Le lexique repart à zéro.")) return;
  S = JSON.parse(JSON.stringify(VIDE));
  if (scormOk) pousserScorm(false);
  else { try { localStorage.removeItem(CLE); } catch (e) { } }
  accueil();
}
window.addEventListener('beforeunload', () => pousserScorm(true));
window.addEventListener('pagehide', () => pousserScorm(true));

const estTrouve = m => S.trouves.includes(m);
const estVu = id => S.vus.includes(id);
const mait = id => S.maitrise[id] || 0;
function noteJuste(ids) { ids.forEach(id => { S.maitrise[id] = Math.min(3, mait(id) + 1); }); }
function noteFausse(ids) { ids.forEach(id => { S.maitrise[id] = Math.max(0, mait(id) - 1); }); }
function voir(id) { if (!estVu(id)) S.vus.push(id); }

const trouvesSys = s => motsSys(s).filter(w => estTrouve(w.m)).length;
const badgeAcquis = s => motsSys(s).length > 0 && trouvesSys(s) === motsSys(s).length;

/* niveau : accessible si le précédent est complété à 80 % (ou mode formateur) */
const motsNiv = n => n === 9 ? [] : MOTS.filter(w => w.niv === n);
const trouvesNiv = n => motsNiv(n).filter(w => estTrouve(w.m)).length;
function nivOuvert(n) {
  if (S.form || n === 1) return true;
  if (n > S.nivMax) return false;
  return true;
}
function majNivMax() {
  for (let n = 1; n < NIV_MAX; n++) {
    const tot = motsNiv(n).length;
    if (tot === 0 || trouvesNiv(n) / tot >= 0.8) S.nivMax = Math.max(S.nivMax, n + 1);
  }
}

/* ================= FABRIQUE DES EXERCICES ================= */
/* Un exercice = { type, ... }
   apprendre  : présentation directe d'un élément sans passerelle
   passerelle : assemblage d'un mot de la langue courante (temps 1 du duo)
   construire : sens → mot (slots ordonnés)
   decoder    : mot → briques + définition
   transfert  : mot jamais vu, à décoder seul
   transmission : repérage en situation
*/
let Q = [], qi = 0, nivEnCours = 1, sessionNouveaux = [];

function fileNiveau(n) {
  const file = [];
  if (n === 9) {
    shuffle(TRANSFERT).forEach(w => file.push({ type: 'transfert', w }));
    shuffle(TRANSMISSIONS).forEach(t => file.push({ type: 'transmission', t }));
    return file;
  }

  const mots = shuffle(motsNiv(n));
  /* on ouvre par les mots qui introduisent une passerelle : l'effet « je savais déjà » d'abord */
  const poids = w => -w.d.filter(id => EL[id].niv === n && !estVu(id) && EL[id].pass).length;
  mots.sort((a, b) => poids(a) - poids(b));

  const introduits = new Set();
  let compteur = 0;

  mots.forEach(w => {
    /* briques neuves de CE mot précisément, triées : apprentissage direct d'abord,
       duos ensuite — pour que le duo tombe TOUJOURS juste avant le mot médical. */
    const neuves = w.d.filter(id => !estVu(id) && !introduits.has(id));
    neuves.forEach(id => introduits.add(id));
    const directs = neuves.filter(id => !(EL[id].pass && P[EL[id].pass]));
    const duos = neuves.filter(id => EL[id].pass && P[EL[id].pass]);
    directs.forEach(id => file.push({ type: 'apprendre', el: EL[id] }));
    duos.forEach(id => file.push({ type: 'passerelle', p: P[EL[id].pass], cle: id }));
    /* le halo n'éclaire que la brique dont le duo vient d'être joué */
    const cle = duos.length ? duos[duos.length - 1] : null;
    const decodeSeul = !!w.libre;                    /* partie non décomposable → décodage */
    const alterne = (compteur % 3 === 2);            /* ~1/3 de décodage */
    file.push({ type: (decodeSeul || alterne) ? 'decoder' : 'construire', w, cle });
    compteur++;
  });

  /* SPIRALE — à partir du niveau 3, on rappelle des mots des niveaux précédents,
     en priorité ceux dont les briques sont les moins maîtrisées. */
  if (n >= 3) {
    const anciens = MOTS.filter(w => w.niv < n && estTrouve(w.m));
    if (anciens.length) {
      anciens.sort((a, b) => moyMait(a) - moyMait(b));
      anciens.slice(0, 3).forEach(w => file.push({ type: 'decoder', w, rappel: true }));
    }
  }
  return file;
}
const moyMait = w => w.d.reduce((s, id) => s + mait(id), 0) / w.d.length;

/* REMÉDIATION — en fin de niveau, les briques ratées (maîtrise < 2) sont re-servies */
function fileRemediation(n) {
  const faibles = E.filter(e => e.niv <= n && estVu(e.id) && mait(e.id) < 2).map(e => e.id);
  if (!faibles.length) return [];
  const cand = MOTS.filter(w => w.niv <= n && w.d.some(id => faibles.includes(id)));
  return shuffle(cand).slice(0, 4).map(w => ({ type: 'decoder', w, remed: true }));
}

function lancerNiveau(n) {
  nivEnCours = n; Q = fileNiveau(n); qi = 0; sessionNouveaux = [];
  if (!Q.length) { accueil(); return; }
  jouer();
}

function suivant() {
  qi++;
  if (qi >= Q.length) {
    if (!Q.some(x => x.remed)) {
      const r = fileRemediation(nivEnCours);
      if (r.length) { Q = Q.concat([{ type: 'remedInfo' }], r); jouer(); return; }
    }
    finNiveau(); return;
  }
  jouer();
}

function jouer() {
  sauver(); majChrome(); window.scrollTo(0, 0);
  const ex = Q[qi];
  const barre = `<div class="progress">Niveau ${nivEnCours} · ${NIVEAUX[nivEnCours - 1].titre} — ${qi + 1} / ${Q.length}</div>
    <button class="retour" onclick="accueil()">← quitter</button>`;
  const rendus = {
    apprendre: exApprendre, passerelle: exPasserelle, construire: exConstruire,
    decoder: exDecoder, transfert: exTransfert, transmission: exTransmission, remedInfo: exRemedInfo
  };
  app.innerHTML = barre + rendus[ex.type](ex);
  if (ex.type === 'passerelle' || ex.type === 'construire') montageInit(ex);
  if (ex.type === 'decoder' || ex.type === 'transfert') decodageInit(ex);
}

/* ---------- distracteurs ---------- */
const norm = s => (s || '').toLowerCase().split(/[(\/]/)[0].replace(/[^a-zà-ÿ]/g, '');
function distracteurs(bonsIds, nb, niv, formesInterdites) {
  const types = bonsIds.filter(id => EL[id]).map(id => EL[id].t);
  const bloque = (formesInterdites || []).map(norm);
  /* vivier : toutes les briques déjà atteignables à ce stade — jamais vide, même au niveau 1 */
  const pool = E.filter(e => !bonsIds.includes(e.id) && e.niv <= (niv || 9) && !bloque.includes(norm(e.f)));
  const memeType = shuffle(pool.filter(e => types.includes(e.t)));
  const autres = shuffle(pool.filter(e => !types.includes(e.t)));
  return memeType.concat(autres).slice(0, nb);
}
const tuile = (f, s, cls, attr) => `<button class="tuile ${cls || ''}" ${attr || ''}><b>${f}</b><small>${s}</small></button>`;

/* ================= 1. APPRENDRE (élément sans passerelle) ================= */
function exApprendre(ex) {
  const e = ex.el;
  const lab = { pre: 'préfixe', rac: 'racine', suf: 'suffixe' }[e.t];
  return `<div class="fiche reveal">
    <div class="eyebrow">Nouvelle brique · ${lab}</div>
    <div class="slots" style="margin-top:6px">${tuile(e.f, e.sens, 'cle')}</div>
    <div class="definition" style="margin-top:18px">Cette brique n'a pas d'équivalent dans la langue courante : il faut la retenir telle quelle.
    <b>${e.f}</b>, c'est <b>${e.sens}</b>.</div>
    <div class="actions"><button class="btn" onclick="apprendreOk('${e.id}')">Compris</button></div>
  </div>`;
}
function apprendreOk(id) { voir(id); S.maitrise[id] = Math.max(1, mait(id)); suivant(); }

/* ================= 2. PASSERELLE + 3. CONSTRUCTION ================= */
let mtg = null;
function montageInit(ex) {
  if (ex.type === 'passerelle') {
    const p = ex.p;
    const bons = p.pieces.map((pc, i) => ({ k: 'p' + i, f: pc.f, s: pc.sens }));
    const dist = distracteurs([], 2, EL[ex.cle].niv, p.pieces.map(pc => pc.f))
      .map(e => ({ k: e.id, f: e.f, s: e.sens }));
    mtg = { ordre: bons.map(b => b.k), slots: Array(bons.length).fill(null), banque: shuffle(bons.concat(dist)), ex };
  } else {
    const w = ex.w;
    const bons = w.d.map(id => ({ k: id, f: EL[id].f, s: EL[id].sens }));
    const dist = distracteurs(w.d, Math.min(4, 6 - w.d.length), w.niv).map(e => ({ k: e.id, f: e.f, s: e.sens }));
    mtg = { ordre: w.d.slice(), slots: Array(w.d.length).fill(null), banque: shuffle(bons.concat(dist)), ex };
  }
  dessineMontage();
}
function exPasserelle(ex) {
  return `<div class="fiche" style="--sysCol:var(--amber)">
    <div class="eyebrow">Temps 1 · un mot que vous connaissez</div>
    <div class="consigne">Assemblez ce mot de tous les jours :</div>
    <div class="cible">${ex.p.def}</div>
    <div id="zone"></div>
  </div>`;
}
function exConstruire(ex) {
  const w = ex.w, sy = SYSTEMES[w.s];
  const rappel = ex.cle ? `<div class="rappel">
      <span class="glow">${EL[ex.cle].f}</span>
      <span>Vous connaissez déjà cette brique : <b>${EL[ex.cle].sens}</b>. La voici dans un mot du soin.</span>
    </div>` : '';
  return `<div class="fiche" style="--sysCol:${sy.couleur}">
    <div class="eyebrow">${ex.cle ? 'Temps 2 · le même, en médecine' : 'Construction'} · ${sy.icone} ${sy.nom}</div>
    ${rappel}
    <div class="consigne">Construisez le mot qui signifie :</div>
    <div class="cible">${w.def}</div>
    <div id="zone"></div>
  </div>`;
}
function dessineMontage() {
  const cle = mtg.ex.type === 'passerelle'
    ? mtg.ex.p.pieces.findIndex(p => p.cle)
    : -1;
  const slots = mtg.slots.map((k, i) => {
    const sep = i > 0 ? '<span class="plus">+</span>' : '';
    if (k === null) return sep + `<div class="slot" data-i="${i}"></div>`;
    const b = mtg.banque.find(x => x.k === k);
    const estCle = (mtg.ex.type === 'passerelle' && i === cle) || (mtg.ex.type === 'construire' && k === mtg.ex.cle);
    return sep + `<div class="slot plein">${tuile(b.f, b.s, estCle ? 'cle' : 'sel', `onclick="retire(${i})"`)}</div>`;
  }).join('');
  const restants = mtg.banque.filter(b => !mtg.slots.includes(b.k));
  const banque = restants.map(b => tuile(b.f, b.s, '', `onclick="pose('${b.k}')"`)).join('');
  const pret = mtg.slots.every(x => x !== null);
  const sol = S.form ? `<button class="btn ghost" onclick="solution()">Voir la réponse</button>` : '';
  document.getElementById('zone').innerHTML = `
    <div class="slots">${slots}</div>
    <div class="banque"><span class="lbl">Les briques</span>${banque || '<span style="color:var(--inkFaint);font-size:13px">— toutes posées —</span>'}</div>
    <div class="actions">
      <button class="btn" id="valider" ${pret ? '' : 'disabled'} onclick="valideMontage()">Valider</button>
      ${sol}<span class="msg" id="msg"></span>
    </div>`;
}
function pose(k) { const i = mtg.slots.indexOf(null); if (i < 0) return; mtg.slots[i] = k; dessineMontage(); }
function retire(i) { mtg.slots[i] = null; dessineMontage(); }
function solution() { mtg.slots = mtg.ordre.slice(); dessineMontage(); }
function valideMontage() {
  const juste = mtg.slots.every((k, i) => k === mtg.ordre[i]);
  const ids = mtg.ex.type === 'construire' ? mtg.ex.w.d : [mtg.ex.cle];
  if (!juste) {
    noteFausse(ids); sauver();
    document.getElementById('msg').className = 'msg ko';
    document.getElementById('msg').textContent = "Pas encore. Relisez le sens de chaque brique.";
    document.querySelectorAll('.slot.plein .tuile').forEach(t => { t.classList.add('faux'); setTimeout(() => t.classList.remove('faux'), 400); });
    return;
  }
  noteJuste(ids);
  if (mtg.ex.type === 'passerelle') { voir(mtg.ex.cle); revelePasserelle(mtg.ex); }
  else reveleMot(mtg.ex.w, mtg.ex.cle);
}

/* ================= 4. DÉCODAGE ================= */
let dec = null;
function exDecoder(ex) {
  const w = ex.w, sy = SYSTEMES[w.s];
  const tag = ex.remed ? 'Rattrapage' : ex.rappel ? 'Rappel — vu précédemment' : 'Décodage';
  return `<div class="fiche" style="--sysCol:${sy.couleur}">
    <div class="eyebrow">${tag} · ${sy.icone} ${sy.nom}</div>
    <div class="consigne">De quelles briques ce mot est-il fait ?</div>
    <div class="motcible">${w.m}</div>
    ${w.libre ? `<div class="indice">Le reste du mot — <b>${w.libre}</b> — ne se décompose pas : ne le cherchez pas.</div>` : ''}
    <div id="zone"></div>
  </div>`;
}
function exTransfert(ex) {
  return `<div class="fiche" style="--sysCol:var(--amber)">
    <div class="eyebrow">Terrain · un mot que vous n'avez jamais vu</div>
    <div class="consigne">Personne ne vous l'a appris. Décodez-le seul.</div>
    <div class="motcible">${ex.w.m}</div>
    <div id="zone"></div>
  </div>`;
}
function decodageInit(ex) {
  const w = ex.w;
  const dist = distracteurs(w.d, 4, 9).map(e => ({ k: e.id, f: e.f, s: e.sens }));
  const bons = w.d.map(id => ({ k: id, f: EL[id].f, s: EL[id].sens }));
  dec = { w, bons: w.d.slice(), choisis: [], banque: shuffle(bons.concat(dist)), etape: 1, ex };
  dessineDecodage();
}
function dessineDecodage() {
  const banque = dec.banque.map(b =>
    tuile(b.f, b.s, dec.choisis.includes(b.k) ? 'sel' : '', `onclick="bascule('${b.k}')"`)).join('');
  const sol = S.form ? `<button class="btn ghost" onclick="solDec()">Voir la réponse</button>` : '';
  document.getElementById('zone').innerHTML = `
    <div class="banque" style="margin-top:22px"><span class="lbl">Sélectionnez toutes les briques présentes (${dec.bons.length})</span>${banque}</div>
    <div class="actions">
      <button class="btn" ${dec.choisis.length === dec.bons.length ? '' : 'disabled'} onclick="valideDecodage()">Valider</button>
      ${sol}<span class="msg" id="msg"></span>
    </div>`;
}
function bascule(k) {
  const i = dec.choisis.indexOf(k);
  if (i >= 0) dec.choisis.splice(i, 1);
  else if (dec.choisis.length < dec.bons.length) dec.choisis.push(k);
  dessineDecodage();
}
function solDec() { dec.choisis = dec.bons.slice(); dessineDecodage(); }
function valideDecodage() {
  const juste = dec.bons.every(k => dec.choisis.includes(k));
  if (!juste) {
    noteFausse(dec.bons); sauver();
    const m = document.getElementById('msg');
    m.className = 'msg ko'; m.textContent = "Non. Une brique au moins n'est pas là.";
    return;
  }
  noteJuste(dec.bons);
  etapeSens();
}
/* étape 2 : le sens */
function etapeSens() {
  const w = dec.w;
  const autres = dec.ex.type === 'transfert'
    ? shuffle(TRANSFERT.filter(x => x.m !== w.m)).slice(0, 2).map(x => x.def)
    : shuffle(MOTS.filter(x => x.m !== w.m && x.s === w.s)).slice(0, 2).map(x => x.def);
  const opts = shuffle([{ d: w.def, ok: 1 }].concat(autres.map(d => ({ d, ok: 0 }))));
  document.getElementById('zone').innerHTML = `
    <div class="choix" style="margin-top:24px">
      <div class="eyebrow" style="margin:0">Et maintenant : que veut-il dire ?</div>
      ${opts.map((o, i) => `<button class="opt" data-ok="${o.ok}" onclick="repSens(this)">${o.d}</button>`).join('')}
    </div>
    <div class="actions"><span class="msg" id="msg"></span></div>`;
}
function repSens(btn) {
  const ok = btn.dataset.ok === '1';
  document.querySelectorAll('.opt').forEach(b => {
    b.onclick = null;
    if (b.dataset.ok === '1') b.classList.add('bon');
    else if (b === btn) b.classList.add('mauvais');
  });
  if (!ok) noteFausse(dec.w.d);
  setTimeout(() => {
    if (dec.ex.type === 'transfert') reveleTransfert(dec.w);
    else reveleMot(dec.w, null);
  }, 900);
}

/* ================= RÉVÉLATIONS ================= */
function chipsDe(ids) {
  return ids.map((id, i) => (i ? '<span class="plus">+</span>' : '') + tuile(EL[id].f, EL[id].sens, 'sel')).join('');
}
function revelePasserelle(ex) {
  const p = ex.p, e = EL[ex.cle];
  app.innerHTML = `<div class="fiche reveal" style="--sysCol:var(--amber)">
    <div class="eyebrow">Temps 1 · résolu</div>
    <div class="motcible">${p.mot}</div>
    <div class="decomp">${p.pieces.map((pc, i) => (i ? '<span class="plus">+</span>' : '') + tuile(pc.f, pc.sens, pc.cle ? 'cle' : 'sel')).join('')}</div>
    <div class="definition">${p.def}</div>
    <div class="indice">${p.indice}</div>
    <div class="rappel" style="margin:20px 0 0">
      <span class="glow">${e.f}</span>
      <span>Retenez cette brique : <b>${e.sens}</b>. Vous en aurez besoin plus tard.</span>
    </div>
    <div class="actions"><button class="btn or" onclick="suivant()">Suivant →</button></div>
  </div>`;
  sauver(); majChrome();
}
function reveleMot(w, cle) {
  const nouveau = !estTrouve(w.m);
  if (nouveau) S.trouves.push(w.m);
  w.d.forEach(voir);
  const gagne = nouveau && badgeAcquis(w.s);
  const sy = SYSTEMES[w.s];
  app.innerHTML = `<div class="fiche reveal" style="--sysCol:${sy.couleur}">
    <div class="sysTag">${sy.icone} ${sy.nom}</div>
    <div class="motcible">${w.m}</div>
    <div class="decomp">${chipsDe(w.d)}${w.libre ? `<span class="plus">+</span><div class="slot fixe"><span>${w.libre}</span></div>` : ''}</div>
    <div class="definition">${w.def}</div>
    ${w.note ? `<div class="indice">${w.note}</div>` : ''}
    ${nouveau ? '<div class="ajout">✦ Ajouté au lexique</div>' : '<div class="indice">Déjà dans votre lexique — mais une révision ne fait pas de mal.</div>'}
    ${gagne ? `<div class="rappel" style="margin-top:16px"><span class="glow">${sy.icone}</span><span><b>Badge ${sy.nom} obtenu.</b> Vous avez complété ce tiroir du lexique.</span></div>` : ''}
    <div class="actions"><button class="btn" onclick="suivant()">Continuer →</button></div>
  </div>`;
  sauver(); majChrome();
}
function reveleTransfert(w) {
  app.innerHTML = `<div class="fiche reveal" style="--sysCol:var(--amber)">
    <div class="eyebrow">Vous l'avez décodé seul</div>
    <div class="motcible">${w.m}</div>
    <div class="decomp">${chipsDe(w.d)}</div>
    <div class="definition">${w.def}</div>
    <div class="indice">Personne ne vous a appris ce mot. Vous l'avez reconstruit. C'est exactement ce qu'on vous demande en stage.</div>
    <div class="actions"><button class="btn" onclick="suivant()">Continuer →</button></div>
  </div>`;
  sauver();
}

/* ================= 5. REMÉDIATION (écran d'annonce) ================= */
function exRemedInfo() {
  const faibles = E.filter(e => e.niv <= nivEnCours && estVu(e.id) && mait(e.id) < 2);
  return `<div class="fiche reveal" style="--sysCol:var(--bad)">
    <div class="eyebrow">Rattrapage</div>
    <div class="cible">Quelques briques ne sont pas encore solides.</div>
    <div class="decomp" style="margin-top:16px">${faibles.slice(0, 8).map(e => tuile(e.f, e.sens, '')).join('')}</div>
    <div class="definition" style="margin-top:8px">On les revoit maintenant, dans d'autres mots. Ce n'est pas une punition : c'est comme ça qu'on retient.</div>
    <div class="actions"><button class="btn" onclick="suivant()">D'accord →</button></div>
  </div>`;
}

/* ================= 6. TRANSMISSION ================= */
let tr = null;
function exTransmission(ex) {
  tr = { t: ex.t, restants: ex.t.mots.slice(), rates: 0 };
  const cible = tr.restants[0];
  const def = (MOTS.find(w => w.m === cible) || {}).def || '';
  return `<div class="fiche" style="--sysCol:var(--ground)">
    <div class="eyebrow">Terrain · transmissions ciblées</div>
    <div class="consigne">Vous lisez le dossier. Retrouvez le terme.</div>
    <div class="transmission" id="txt">${ex.t.texte.replace(/<b>(.*?)<\/b>/g, (m, w) => `<b onclick="clicTerme(this,'${w}')">${w}</b>`)}</div>
    <div class="cible" id="quest" style="font-size:19px">Cliquez sur le terme qui signifie : <b>${def}</b></div>
    <div class="actions"><span class="msg" id="msg"></span></div>
  </div>`;
}
function clicTerme(el, mot) {
  if (el.classList.contains('done')) return;
  const cible = tr.restants[0];
  const eq = (a, b) => a.toLowerCase() === b.toLowerCase();
  if (!eq(mot, cible)) {
    el.classList.add('rate'); tr.rates++;
    setTimeout(() => el.classList.remove('rate'), 700);
    document.getElementById('msg').className = 'msg ko';
    document.getElementById('msg').textContent = 'Non. Décomposez le mot avant de cliquer.';
    return;
  }
  el.classList.add('done'); el.classList.remove('rate');
  tr.restants.shift();
  if (!tr.restants.length) {
    document.getElementById('quest').innerHTML = '<b>Transmission entièrement décodée.</b>';
    document.querySelector('.actions').innerHTML = '<button class="btn" onclick="suivant()">Continuer →</button>';
    return;
  }
  const suiv = tr.restants[0];
  const def = (MOTS.find(w => w.m === suiv) || {}).def || '';
  document.getElementById('quest').innerHTML = `Cliquez sur le terme qui signifie : <b>${def}</b>`;
  document.getElementById('msg').textContent = '';
}

/* ================= FIN DE NIVEAU ================= */
function finNiveau() {
  if (!S.nivFaits.includes(nivEnCours)) S.nivFaits.push(nivEnCours);
  majNivMax(); sauver(); majChrome();
  const tot = motsNiv(nivEnCours).length;
  const fait = trouvesNiv(nivEnCours);
  const suite = nivEnCours < NIV_MAX && nivOuvert(nivEnCours + 1);
  app.innerHTML = `<div class="fiche reveal fin">
    <div class="eyebrow" style="text-align:center">Niveau ${nivEnCours} terminé</div>
    <div class="big">${NIVEAUX[nivEnCours - 1].titre}</div>
    ${nivEnCours < 9 ? `<div class="progress" style="margin:10px 0 0">${fait} / ${tot} mots de ce niveau dans votre lexique</div>` : ''}
    <div class="progress">${S.trouves.length} / ${TOTAL} au total</div>
    <div class="actions" style="justify-content:center;margin-top:22px">
      ${suite ? `<button class="btn or" onclick="lancerNiveau(${nivEnCours + 1})">Niveau ${nivEnCours + 1} →</button>` : ''}
      <button class="btn ghost" onclick="lexique()">Voir mon lexique</button>
      <button class="btn ghost" onclick="accueil()">Les niveaux</button>
    </div>
  </div>`;
}

/* ================= LEXIQUE ================= */
let ouverts = {};
function lexique() {
  actif('nLex'); majChrome(); window.scrollTo(0, 0);
  const tiroirs = Object.keys(SYSTEMES).map(s => {
    const sy = SYSTEMES[s], mots = motsSys(s), n = trouvesSys(s), tot = mots.length;
    const won = badgeAcquis(s);
    const open = ouverts[s];
    const cartes = mots.map(w => {
      if (estTrouve(w.m) || S.form) {
        return `<button class="mc" onclick="ficheMot('${w.m.replace(/'/g, "\\'")}')">
          <b>${w.m}</b><small>${w.d.map(id => EL[id].f).join(' + ')}</small></button>`;
      }
      const pts = '·'.repeat(Math.min(14, w.m.replace(/[^a-zA-ZÀ-ÿ]/g, '').length));
      return `<button class="mc vide" onclick="alert('Ce mot se débloque au niveau ${w.niv} — ${NIVEAUX[w.niv - 1].titre}.')">
        <b>${pts}</b><small>niveau ${w.niv}</small></button>`;
    }).join('');
    return `<div class="tiroir" style="--sysCol:${sy.couleur}">
      <button class="tiroirTete" onclick="ouvrir('${s}')">
        <span class="ic">${sy.icone}</span><b>${sy.nom}</b>
        <span class="cpt">${n} / ${tot}</span>
        <span class="bg ${won ? 'won' : ''}">${won ? '★' : '☆'}</span>
      </button>
      <div class="barre"><i style="width:${100 * n / tot}%"></i></div>
      ${open ? `<div class="corps">${cartes}</div>` : ''}
    </div>`;
  }).join('');
  app.innerHTML = `<div class="h2">Le lexique</div>
    <div class="sub">Chaque case vide est un mot qui vous attend. Ouvrez un tiroir pour voir lesquels.</div>
    ${tiroirs}`;
}
function ouvrir(s) { ouverts[s] = !ouverts[s]; lexique(); }
function ficheMot(m) {
  const w = MOTS.find(x => x.m === m); if (!w) return;
  const sy = SYSTEMES[w.s];
  app.innerHTML = `<button class="retour" onclick="lexique()">← le lexique</button>
    <div class="fiche reveal" style="--sysCol:${sy.couleur}">
      <div class="sysTag">${sy.icone} ${sy.nom}</div>
      <div class="motcible">${w.m}</div>
      <div class="decomp">${chipsDe(w.d)}${w.libre ? `<span class="plus">+</span><div class="slot fixe"><span>${w.libre}</span></div>` : ''}</div>
      <div class="definition">${w.def}</div>
      ${w.note ? `<div class="indice">${w.note}</div>` : ''}
      <div class="indice">Rencontré au niveau ${w.niv} — ${NIVEAUX[w.niv - 1].titre}.</div>
    </div>`;
}

/* ================= BADGES ================= */
function badges() {
  actif('nBadges'); majChrome(); window.scrollTo(0, 0);
  const cartes = Object.keys(SYSTEMES).map(s => {
    const sy = SYSTEMES[s], won = badgeAcquis(s);
    return `<div class="bd ${won ? 'won' : ''}">
      <span class="ic">${sy.icone}</span><b>${sy.nom}</b>
      <small>${trouvesSys(s)} / ${motsSys(s).length}</small></div>`;
  }).join('');
  const total = S.trouves.length, grand = total === TOTAL;
  app.innerHTML = `<div class="h2">Badges</div>
    <div class="sub">Un badge par système — il tombe quand le tiroir est complet. Pas avant.</div>
    <div class="badges">${cartes}
      <div class="bd grand ${grand ? 'won' : ''}">
        <span class="ic">🏆</span><b>Le Grand Lexique</b>
        <small>${total} / ${TOTAL} mots</small>
      </div>
    </div>`;
}

/* ================= FORMATEUR ================= */
document.getElementById('formLink').onclick = () => {
  if (S.form) { if (confirm("Quitter le mode formateur ?")) { S.form = false; sauver(); accueil(); } return; }
  const c = prompt("Code formateur :");
  if (c === CODE_FORMATEUR) { S.form = true; S.nivMax = NIV_MAX; sauver(); accueil(); }
  else if (c !== null) alert("Code incorrect.");
};
document.getElementById('nAccueil').onclick = accueil;
document.getElementById('nLex').onclick = lexique;
document.getElementById('nBadges').onclick = badges;

/* ================= GO ================= */
charger(); accueil();

</script>
</body>
</html>
