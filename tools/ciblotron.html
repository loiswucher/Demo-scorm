<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciblotron</title>
<style>
  :root {
    --bg: #E6E9E4;
    --surface: #FBFBF8;
    --surface-2: #F1F3EE;
    --ink: #163A40;
    --ink-soft: #4E676B;
    --ink-faint: #8A9B9C;
    --cible: #B23A32;
    --cible-soft: #F3E1DF;
    --teal: #2B6E7C;
    --line: #D2D8D0;
    --line-strong: #B9C1B8;
    --focus: #2B6E7C;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  .app {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    padding: clamp(16px, 4vw, 40px);
    line-height: 1.5;
  }

  .wrap { max-width: 1120px; margin: 0 auto; }

  /* ---------- Masthead ---------- */
  .masthead {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 18px; margin-bottom: 26px;
    border-bottom: 1px solid var(--line-strong);
  }
  .bullseye { flex: 0 0 auto; }
  .masthead h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(20px, 3.4vw, 27px);
    letter-spacing: -0.01em;
    margin: 0; line-height: 1.1;
  }
  .masthead .eyebrow {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--teal); margin: 0 0 3px;
  }

  /* ---------- Setup form ---------- */
  .lead {
    font-family: var(--serif);
    font-size: clamp(16px, 2.2vw, 19px);
    color: var(--ink-soft);
    max-width: 60ch; margin: 0 0 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 26px;
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field.full { grid-column: 1 / -1; }
  .field label {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  select, input[type="text"], input[type="number"] {
    font-family: var(--sans); font-size: 15px; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    padding: 11px 13px;
    width: 100%;
    appearance: none;
    transition: border-color .15s, box-shadow .15s;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%234E676B' stroke-width='1.5'/></svg>");
    background-repeat: no-repeat;
    background-position: right 13px center;
    padding-right: 34px;
  }
  select:focus, input:focus {
    outline: none; border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(43,110,124,0.18);
  }
  .age-slider { display: flex; align-items: center; gap: 14px; }
  .age-slider input[type="range"] {
    flex: 1 1 auto; appearance: none; height: 4px; border-radius: 2px;
    background: var(--line-strong); outline: none; cursor: pointer;
  }
  .age-slider input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--cible); border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--cible); cursor: pointer;
  }
  .age-slider input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--cible); border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--cible); cursor: pointer;
  }
  .age-readout {
    flex: 0 0 auto; min-width: 64px; text-align: right;
    font-family: var(--sans); font-size: 14px; color: var(--ink-soft);
  }
  .age-readout b { color: var(--ink); font-size: 16px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 3px; }
  .chip {
    font-family: var(--sans); font-size: 12.5px;
    background: var(--surface-2); color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 40px;
    padding: 5px 11px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { background: var(--cible-soft); color: var(--cible); border-color: var(--cible); }

  .actions-row { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  button.btn {
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    cursor: pointer; border-radius: 3px;
    padding: 12px 22px;
    transition: transform .06s, background .15s, border-color .15s, color .15s;
  }
  button.btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--ink); color: #fff; border: 1px solid var(--ink);
  }
  .btn-primary:hover { background: #0E2A2E; }
  .btn-ghost {
    background: transparent; color: var(--ink); border: 1px solid var(--line-strong);
  }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn-cible {
    background: var(--cible); color: #fff; border: 1px solid var(--cible);
  }
  .btn-cible:hover { background: #94302A; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .hint { font-size: 12.5px; color: var(--ink-faint); }

  .code-block {
    margin-top: 34px; padding-top: 18px; border-top: 1px dashed var(--line);
  }
  .code-block > label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); display: block; margin-bottom: 7px;
  }
  .code-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .code-row input {
    flex: 1 1 320px; font-family: var(--mono); font-size: 13px;
  }
  .code-row .btn { flex: 0 0 auto; padding: 11px 18px; font-size: 13.5px; }
  #code-hint.err { color: var(--cible); }

  /* ---------- Loading ---------- */
  .loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 80px 20px; text-align: center;
  }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--cible);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { font-family: var(--serif); font-style: italic; color: var(--ink-soft); margin: 0; }

  /* ---------- Case screen ---------- */
  .meta-bar {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px;
  }
  .tag {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 3px; padding: 5px 10px; color: var(--ink-soft);
  }
  .tag b { color: var(--ink); font-weight: 600; }

  .case-layout { display: grid; grid-template-columns: 1fr; gap: 24px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
  }
  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--line);
  }
  .panel-head h2 {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--teal); margin: 0; font-weight: 600;
  }
  .panel-head .sub { font-size: 12px; color: var(--ink-faint); }

  .narrative {
    font-family: var(--serif);
    font-size: 16.5px; line-height: 1.7; color: var(--ink);
    padding: 22px 24px;
    white-space: pre-wrap;
  }
  .narrative .name { color: var(--cible); font-weight: 600; font-style: normal; }

  .notice {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--cible-soft); color: #7A2B25;
    border-left: 3px solid var(--cible);
    padding: 12px 16px; margin: 0 24px 20px;
    font-size: 13.5px; border-radius: 0 3px 3px 0;
  }
  .notice svg { flex: 0 0 auto; margin-top: 2px; }

  /* ---------- Editable table ---------- */
  .table-scroll { overflow-x: auto; padding: 4px; }
  table.dar {
    width: 100%; border-collapse: collapse; min-width: 860px;
    font-size: 14px;
  }
  table.dar thead th {
    text-align: left; vertical-align: bottom;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--surface); background: var(--ink);
    padding: 10px 12px; font-weight: 600;
    border-right: 1px solid rgba(255,255,255,0.14);
  }
  table.dar thead th:first-child { border-radius: 3px 0 0 0; }
  table.dar thead th.col-cible { background: var(--cible); }
  table.dar thead th:last-child { border-right: none; border-radius: 0 3px 0 0; }
  table.dar td {
    border: 1px solid var(--line); vertical-align: top; padding: 0;
    background: var(--surface);
  }
  .cell {
    min-height: 88px; padding: 11px 12px;
    outline: none; line-height: 1.5;
    font-family: var(--sans); font-size: 14px; color: var(--ink);
  }
  .cell:empty::before { content: attr(data-ph); color: var(--ink-faint); }
  .cell:focus { background: #FFFEF6; box-shadow: inset 0 0 0 2px rgba(43,110,124,0.35); }
  td.col-cible .cell { font-weight: 600; color: var(--cible); }

  .gear-btn {
    background: transparent; border: 1px solid var(--line-strong); border-radius: 4px;
    width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-faint); cursor: pointer; transition: color .15s, border-color .15s, transform .3s;
  }
  .gear-btn:hover { color: var(--teal); border-color: var(--teal); transform: rotate(25deg); }

  .gm-overlay {
    position: fixed; inset: 0; background: rgba(22,58,64,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .gm-box {
    background: var(--surface); border-radius: 6px; max-width: 480px; width: 100%;
    max-height: 85vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .gm-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--line);
  }
  .gm-head h3 {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--teal); margin: 0;
  }
  .gm-close {
    background: transparent; border: none; font-size: 20px; color: var(--ink-faint);
    cursor: pointer; line-height: 1; padding: 4px;
  }
  .gm-close:hover { color: var(--cible); }
  .gm-body { padding: 20px; }
  .gm-body p.intro { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 16px; }
  .gm-pass-row { display: flex; gap: 10px; }
  .gm-pass-row input {
    flex: 1; font-family: var(--sans); font-size: 15px; padding: 10px 12px;
    border: 1px solid var(--line-strong); border-radius: 3px;
  }
  .gm-error { color: var(--cible); font-size: 13px; margin-top: 8px; display: none; }
  .gm-error.show { display: block; }

  .gm-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  .gm-table th {
    text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--surface); background: var(--ink); padding: 7px 9px;
  }
  .gm-table th.gm-cible-h { background: var(--cible); }
  .gm-table td { border: 1px solid var(--line); padding: 8px 9px; vertical-align: top; }
  .gm-table td.gm-cible { color: var(--cible); font-weight: 600; }
  .gm-note {
    background: var(--cible-soft); border-left: 3px solid var(--cible);
    padding: 8px 10px; font-size: 12px; color: #7A2B25; margin-top: 4px; border-radius: 0 3px 3px 0;
  }
  .gm-empty { font-size: 13.5px; color: var(--ink-faint); font-style: italic; }
  select.cell-select {
    width: 100%; min-height: 88px; padding: 11px 12px;
    font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--cible);
    background: var(--surface); border: none; outline: none; cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23B23A32' stroke-width='1.5'/></svg>");
    background-repeat: no-repeat; background-position: right 12px top 14px;
  }
  select.cell-select:focus { background-color: #FFFEF6; box-shadow: inset 0 0 0 2px rgba(43,110,124,0.35); }
  td.identcol { background: var(--surface-2); }

  .row-tools { width: 34px; }
  .row-tools td { border: none; background: transparent; }
  .del-row {
    border: none; background: transparent; cursor: pointer;
    color: var(--ink-faint); font-size: 17px; line-height: 1;
    padding: 6px; border-radius: 3px;
  }
  .del-row:hover { color: var(--cible); background: var(--cible-soft); }

  .table-foot {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    padding: 14px 20px; border-top: 1px solid var(--line);
  }
  .add-row {
    font-family: var(--sans); font-size: 13.5px; font-weight: 600;
    background: transparent; border: 1px dashed var(--line-strong);
    color: var(--ink-soft); border-radius: 3px; padding: 8px 14px; cursor: pointer;
  }
  .add-row:hover { border-color: var(--teal); color: var(--teal); }

  .footer-actions {
    display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px;
    padding-top: 22px; border-top: 1px solid var(--line-strong);
  }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; font-size: 14px;
    padding: 11px 20px; border-radius: 4px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .error-box {
    background: var(--cible-soft); border: 1px solid var(--cible); color: #7A2B25;
    border-radius: 4px; padding: 16px 18px; font-size: 14px;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  }

  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
    .masthead { gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="wrap">
    <div class="masthead">
      <svg class="bullseye" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="#163A40" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="11.5" fill="none" stroke="#163A40" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="5" fill="#B23A32"/>
      </svg>
      <div>
        <p class="eyebrow">Méthode D · A · R</p>
        <h1>Ciblotron</h1>
      </div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const view = document.getElementById('view');
  const toastEl = document.getElementById('toast');

  /* ===================== SCORM 1.2 (suivi minimal) ===================== */
  // Se contente de tracer le nombre de cas générés. Aucune notion de score ou
  // de réussite/échec : ce n'est pas un quiz. Fonctionne aussi bien hors LMS
  // (l'API n'est simplement pas trouvée, et rien ne se passe).
  const Scorm = (function () {
    let api = null;
    let initialized = false;
    let casCount = 0;

    function findAPI(win) {
      let attempts = 0;
      let w = win;
      while (w && attempts < 500) {
        if (w.API) return w.API;
        if (w.parent === w) break;
        w = w.parent;
        attempts++;
      }
      return null;
    }

    function init() {
      try {
        api = findAPI(window) || (window.opener ? findAPI(window.opener) : null);
        if (!api) return; // hors LMS : usage normal du fichier, rien à faire
        const ok = api.LMSInitialize("");
        if (ok === "true" || ok === true) {
          initialized = true;
          const stored = api.LMSGetValue("cmi.suspend_data");
          casCount = parseInt(stored, 10) || 0;
        }
      } catch (e) { /* silencieux : ne doit jamais bloquer l'outil */ }
    }

    function recordCaseGenerated() {
      if (!initialized || !api) return;
      try {
        casCount++;
        api.LMSSetValue("cmi.suspend_data", String(casCount));
        api.LMSSetValue("cmi.core.lesson_status", "completed");
        api.LMSCommit("");
      } catch (e) { /* silencieux */ }
    }

    function terminate() {
      if (!initialized || !api) return;
      try { api.LMSCommit(""); api.LMSFinish(""); } catch (e) { /* silencieux */ }
    }

    window.addEventListener("beforeunload", terminate);
    return { init, recordCaseGenerated, terminate, get count(){ return casCount; } };
  })();
  Scorm.init();

  const SERVICES = ["Maternité","Néonatologie","Pédiatrie","Urgences pédiatriques","Urgences adultes","Médecine","Oncologie","Chirurgie","Gériatrie / EHPAD","SSR","Psychiatrie","Soins à domicile","Bloc / SSPI"];
  const PROS = ["Auxiliaire de puériculture","Aide-soignant(e)","AES (Accompagnant éducatif et social)","Infirmier(e) (IDE)","Étudiant(e) en soins"];

  /* ===================== BANQUES DE CIBLES PAR PROFESSIONNEL ===================== */
  // Liste fermée : uniquement pour les professionnels couverts ci-dessous.
  // Les autres professionnels gardent un champ libre pour la colonne Cible.
  const CIBLES_AP = [
    { groupe: "Alimentation", items: ["Dénutrition","Déshydratation","Fausse route","Hyperglycémie","Hypoglycémie","Nausées/Vomissements","Perte de poids","Polydipsie","Polyphagie","Prise de poids","Reflux gastro-oesophagien","Refus de s'alimenter","Troubles de la déglutition"] },
    { groupe: "Cardio-vasculaire", items: ["Arythmie","Bradycardie","Douleur thoracique","Hémorragie","Hypertension artérielle","Hypotension artérielle","Phlébite","Tachycardie","Vertiges"] },
    { groupe: "Cognition/perception", items: ["Anxiété","Asthénie","Baisse de l'estime de soi","Confusion","Désorientation","Douleur","Dysphasie","État de conscience","Hypersensibilité sensorielle","Hypo sensibilité sensorielle","Peur","Photophobie","Troubles de la mémoire","Troubles spatio-temporels"] },
    { groupe: "Communication/relation", items: ["Compréhension","Logorrhée","Mutisme","Surdité","Troubles de la parole"] },
    { groupe: "Comportement", items: ["Addiction","Agitation","Ébriété","Insomnie","Refus de soin","Repli sur soi","Risque suicidaire","Scarifications","Somnolence","Troubles du comportement","Violence mentale","Violence physique","Violence verbale"] },
    { groupe: "Élimination", items: ["Absence de méconium","Anurie","Brûlures mictionnelles","Constipation","Diarrhées","Encoprésie","Énurésie","Globe vésical","Hématurie","Méléna","Métrorragie","Oligurie","Pollakiurie","Polyurie","Rectorragie","Rétention urinaire"] },
    { groupe: "Environnement/socio-familial", items: ["Conflit inter-familial","Deuil","Difficultés financières","Exclusion sociale","Fugue","Isolement familial","Isolement social","Précarité","Relation avec l'entourage","Rendez-vous extérieur","Séparation","Sortie inopinée","Utilisation des dispositifs médicaux"] },
    { groupe: "Mobilisation", items: ["Altération de la mobilité","Boiterie","Chute","Déambulation","Faiblesse musculaire","Premier lever","Refus de mobilisation","Transferts"] },
    { groupe: "Peau/tégument", items: ["Alopécie","Cicatrisation","Cyanose","Érythème","Escarre","Marbrures","Mycose","Œdème","Pétéchie","Phlyctène","Plaie","Prurit","Rash cutané"] },
    { groupe: "Respiration", items: ["Bradypnée","Dyspnée","Encombrement","Expectorations","Hypoxémie","Obstruction des voies aériennes","Pauses respiratoires","Polypnée","Sibilant (sifflement)","Tachypnée","Toux"] },
    { groupe: "Thermo-neuro-régulation", items: ["Céphalées","Convulsions","Frissons/Tremblements","Hypersudation","Hyperthermie","Hypothermie","Sueurs"] },
  ];

  const CIBLES_AS = [
    { groupe: "Alimentation", items: ["Dénutrition","Déshydratation","Fausse route","Hyperglycémie","Hypoglycémie","Nausées/Vomissements","Perte de poids","Polydipsie","Polyphagie","Prise de poids","Reflux gastro-oesophagien","Refus de s'alimenter","Troubles alimentaires","Troubles de la déglutition"] },
    { groupe: "Cardio-vasculaire", items: ["Arythmie","Bradycardie","Douleur thoracique","Hémorragie","Hypertension artérielle","Hypotension artérielle","Phlébite","Tachycardie","Vertiges"] },
    { groupe: "Cognition/perception", items: ["Agnosie","Amnésie","Anxiété","Aphasie","Apraxie","Asthénie","Baisse de l'estime de soi","Confusion","Désorientation","Dysphasie","État de conscience","Peur","Troubles de la mémoire","Troubles spatio-temporels"] },
    { groupe: "Communication/relation", items: ["Communication non verbale","Communication verbale","Compréhension","Logorrhée","Mutisme","Surdité","Troubles de la parole"] },
    { groupe: "Comportement", items: ["Addiction","Agitation","Auto agressivité","Ébriété","Hétéro agressivité","Insomnie","Refus de soin","Repli sur soi","Risque suicidaire","Somnolence","Troubles du comportement"] },
    { groupe: "Élimination", items: ["Anurie","Brûlures mictionnelles","Constipation","Diarrhées","Globe vésical","Hématurie","Incontinence fécale","Incontinence urinaire","Méléna","Oligurie","Pollakiurie","Polyurie","Rectorragie","Rétention urinaire"] },

  };

  function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function shuffle(a){ const c=a.slice(); for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];} return c; }
  function pickN(a,n){ return shuffle(a).slice(0,n); }
  function num(x){ return String(x).replace('.',','); }
  function catOf(s){
    if(s==='Maternité'||s==='Néonatologie') return 'neo';
    if(s==='Pédiatrie'||s==='Urgences pédiatriques') return 'peds';
    if(s==='Gériatrie / EHPAD'||s==='Soins à domicile') return 'geria';
    return 'adult';
  }
  function makeCtx(){
    const fem = params.sexe==='Féminin';
    const v = parseInt(params.ageValue,10)||0;
    let bank;
    if(catOf(params.service)==='neo' || params.ageUnit!=='ans') bank='baby';
    else if(v<18) bank='child';
    else if(v>=70) bank='senior';
    else bank='adult';
    return {
      name: pick(NAMES[bank][fem?'F':'M']),
      fem, v, unit: params.ageUnit, service: params.service, pro: params.pro,
      e: fem?'e':'', ne: fem?'née':'né', il: fem?'elle':'il', Il: fem?'Elle':'Il', lui: fem?'elle':'lui'
    };
  }
  function agePhrase(c){
    if(c.unit==='jours') return `${c.ne} il y a ${c.v} jour${c.v>1?'s':''}`;
    if(c.unit==='mois')  return `âgé${c.e} de ${c.v} mois`;
    return `âgé${c.e} de ${c.v} ans`;
  }
  function fill(s,c){
    return s.replace(/{n}/g,c.name).replace(/{age}/g,agePhrase(c))
            .replace(/{Il}/g,c.Il).replace(/{il}/g,c.il).replace(/{lui}/g,c.lui)
            .replace(/{ne}/g,c.ne).replace(/{e}/g,c.e);
  }

  /* ---- assemblage d'un cas ---- */
  function buildCase(entry, c){
    const body = pickN(entry.theme(c), 4);
    const p1 = [entry.open, body[0], body[1], fam(c)];
    const p2 = [body[2], body[3], para(c), vitals(c)];
    return fill(p1.join(' '),c) + "\n\n" + fill(p2.join(' '),c);
  }

  const BANK_CASES = [
    { service: "Chirurgie", sexe: "Féminin", problem: "Signes digestifs à surveiller après un changement de traitement", ageMin: 65, ageMax: 120, ageDisplay: 69, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous êtes en stage dans un service de chirurgie conventionnelle et vous prenez en charge, en collaboration avec l'infirmier :\n\nMme V., 69 ans, est transférée de l'hôpital spécialisé en santé mentale de la région où elle était suivie pour dépression névrotique depuis quelques semaines. Elle est admise dans le service ce matin à 7h. Elle est à jeun. Le médecin du service lui a prescrit par anticipation un bilan sanguin.\n\nIl y a 2 jours elle a présenté un syndrome sub-occlusif attribué à son traitement antidépresseur, entrainant une altération de l'état général.\n\nSon traitement a été suspendu en attendant la reprise correcte du transit intestinal.\n\nCette patiente fait donc l'objet d'une surveillance étroite :\n- mesure des paramètres vitaux 2 fois / jour (PA, FC, FR, T°, Douleur),\n- surveillance de l'élimination (fiche selles et diurèse),\n- surveillance d'apparition de troubles de l'humeur et recrudescence de l'anxiété.\n\nCe matin, à 8h30 elle signale avoir eu quelques selles dures et noires.\n\nAu regard de cette information, lors de la visite, le médecin suspecte une présence de mélaena et prescrit une gastroscopie sous anesthésie locale, en service d'explorations fonctionnelles, qui pourrait avoir lieu en fin de matinée, au plus tard dans l'après-midi.\n\nPour cela, l'infirmière vous demande de la laisser à jeun et de veiller à sa préparation locale (hygiène corporelle, soins de bouche). Elle lui posera une perfusion d'attente.\n\nMme V. semble se renfermer sur elle-même, la communication est difficile. Vous parvenez à rentrer en contact avec elle lors des soins d'hygiène. Elle se confie à vous sur ses soucis familiaux." },
    { service: "Chirurgie", sexe: "Féminin", problem: "Douleur post-opératoire avec signe d'alerte associé", ageMin: 65, ageMax: 120, ageDisplay: 72, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous êtes en stage dans un service de chirurgie conventionnelle et vous prenez en charge, en collaboration avec l'infirmier :\n\nMme A., 72 ans, est à J1 d'une cholécystectomie. Elle est perfusée, a des pansements de cœlioscopie et une aspiration de type Redon. Elle est sous anticoagulants, a des bas anti thromboses, et n'a pas le droit de se lever avant l'avis du chirurgien. Elle n'a pas uriné cette nuit.\n\nCe matin au tour de 8h : elle présente des douleurs du bas ventre avec une EN à 6/10 et le pansement au niveau de l'ombilic est imbibé de sang. L'infirmière lui donne un antalgique.\n\nA 8h30, elle sonne et vous dit ne pas se sentir bien, vous lui prenez ses paramètres vitaux : sa tension artérielle est à 9/5, ses pulsations sont à 110 BPM. Ses extrémités sont légèrement cyanosées." },
    { service: "Chirurgie", sexe: "Masculin", problem: "Chute suivie d'un signe général à surveiller", ageMin: 65, ageMax: 120, ageDisplay: 69, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous êtes en stage dans un service de chirurgie conventionnelle et vous prenez en charge, en collaboration avec l'infirmier :\n\nMr H., 69 ans, à J3 d'une PTH droite. Ce matin Mr est retrouvé à terre au moment de l'installation pour le petit déjeuner. Il vous dit avoir voulu se rendre aux toilettes mais a glissé en se tenant à l'adaptable. Il a mal à la jambe droite EN 6/10, ne veut pas bouger, a peur. A l'aide de collègues et après avoir vérifié que tout fonctionne, Mr est réinstallé dans son lit. Le chirurgien a été prévenu et doit passer le voir.\n\nDans la matinée Mr sonne, il vous dit avoir subitement chaud, qu'il est suant et a soif. Vous lui prenez sa température et constatez qu'elle est à 38.3°C." },
    { service: "Médecine", sexe: "Masculin", problem: "Douleur d'un membre associée à un état moral fragile", ageMin: 50, ageMax: 75, ageDisplay: 55, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous êtes en stage dans un service de médecine polyvalente et vous prenez en charge, en collaboration avec l'infirmier :\n\nMr T., 55 ans est hospitalisé en médecine depuis 3 jours pour altération de l'état général. Il a pour antécédent une dépression traitée et suivie par le CMP. Il est fatigué et reste donc alité une bonne partie de la journée. Il a peu d'appétit. Ses yeux reflètent une grande tristesse. Il est angoissé et pour la première fois ce matin, il a pleuré longuement. Il a confié sa peur de l'avenir car il vit seul et ne le supporte plus. En l'interrogeant l'aide-soignante recueille des informations : il a depuis cette nuit des douleurs dans la jambe droite, au niveau du mollet, EN 5/10. Le mollet est chaud, dur et rouge. Elle lui demande de ne pas se lever jusqu'à nouvel ordre." },
    { service: "Médecine", sexe: "Féminin", problem: "Malaise du matin avec plaie associée découverte à la toilette", ageMin: 50, ageMax: 75, ageDisplay: 60, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous êtes en stage dans un service de médecine polyvalente et vous prenez en charge, en collaboration avec l'infirmier :\n\nMme B., 60 ans, a été admise par le biais des urgences pour chute à domicile. Elle vit seule depuis le décès de son époux survenu il y a 6 mois. Ce matin à 7h elle vous dit qu'elle a des céphalées, des troubles visuels et qu'elle ne se sent pas bien. Vous la trouvez pâle et en sueur. Vous lui demandez de rester allongée et vous lui faites une glycémie capillaire. Sa glycémie est à 0.50g/l.\n\nLors de la toilette, Mme B vous demande de l'aide. Elle n'arrive pas à se laver le dos, les jambes et les pieds. Au niveau du membre inférieur vous remarquez une plaie sous le pied droit. Elle est inflammée et un liquide jaune s'extériorise. Son pied est chaud et légèrement œdématié. Mme B vous dit ne pas avoir mal (EN 0). Vous prenez soin de faire un nettoyage minutieux et appelez l'infirmier." },
    { service: "Médecine", sexe: "Masculin", problem: "Gêne respiratoire avec propos inquiétants du patient", ageMin: 75, ageMax: 120, ageDisplay: 83, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous êtes en stage dans un service de médecine polyvalente et vous prenez en charge, en collaboration avec l'infirmier :\n\nMr R., 83 ans est hospitalisé depuis 2 jours pour une décompensation aigue de sa broncho pneumopathie chronique obstructive. Mr est célibataire et vit seul. Il est très attaché à ses perruches restées à son domicile. Le gardien de l'immeuble où il vit s'en occupe le temps de l'hospitalisation. Ce matin, il vous dit n'avoir pas bien dormi. Il semble anxieux et sa fréquence respiratoire est élevée (30). Sa saturation en oxygène est de 89 %. En le réinstallant l'aide-soignant constate qu'il est moite et que tout son lit est trempé de sueur. Il n'est pas fébrile mais tousse beaucoup et crache péniblement des sécrétions épaisses et jaunes. Il vous dit que ce n'est pas une vie et qu'il a peur de mourir en étouffant. Il refuse de boire et manger et accepte juste une réinstallation en position demie assise. Il ne veut pas se lever ni faire sa toilette pour le moment." },
    { service: "Médecine", sexe: "Masculin", problem: "Disparition du service avec refus alimentaire au retour", ageMin: 75, ageMax: 120, ageDisplay: 86, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous êtes en stage dans un service de médecine polyvalente et vous prenez en charge, en collaboration avec l'infirmier :\n\nMr T., 86 ans, a été transféré d'un EHPAD hier soir pour une altération de l'état général et confusion d'apparition récente.\n\nLe médecin a prescrit un bilan complet dont un bilan nutritionnel car le médecin de l'EHPAD a signalé que ce patient refuse de s'alimenter et s'agite lors des sollicitations des soignants. Depuis son admission, ce patient, en manque de repères, déambule en permanence dans le service. A 8h, ne le trouvant pas dans sa chambre, vous alertez l'infirmier et l'accueil de l'hôpital de sa disparition. Il est retrouvé errant dans le hall d'entrée de l'établissement et est raccompagné dans le service par la sécurité. Vous l'installez pour le petit déjeuner. Il vous injurie et refuse de manger. Dit que « vous allez l'empoisonner ».\n\nSes prescriptions ont été réajustées par le médecin et comportent :\n- Suivi diététicienne pour adapter l'alimentation\n- Consultation gérontopsychiatre\n- Suivi des ingesta pendant 3 jours\n- Fiche contrôle de selles, surveillance de diurèse\n- Contrôle du poids ce jour\n\nSa déambulation excessive et sa fugue entraînent, ce matin, la prescription d'une contention ventrale au fauteuil de 1h30, au moment des repas." },
    { service: "Oncologie", sexe: "Féminin", problem: "Fièvre et atteinte cutanée chez une patiente immunodéprimée", ageMin: 65, ageMax: 120, ageDisplay: 67, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un service de médecine oncologie et vous prenez en charge, en collaboration avec l'infirmier :\n\nMme A, 67 ans, qui est actuellement en traitement de chimiothérapie pour lymphome. Sa dernière chimiothérapie date de 72h. Elle est arrivée dans le service cette nuit, suite à un épisode fébrile T° 38.7C, une dysphagie, des douleurs dans la bouche, une inappétence alimentaire et une grande asthénie. Elle était accompagnée de son époux désemparé de voir son épouse s'altérer au domicile. La prise de sang aux urgences montre une aplasie médullaire nécessitant d'isoler Mme A pour la protéger. La patiente est perfusée sur chambre implantable, avec une hydratation, une alimentation parentérale, une antibiothérapie et des antipyrétiques.\n\nCe matin, elle est alitée, elle n'arrive pas à se lever seule. Elle est toutefois coopérante. Elle est asthénique, fébrile (T° 38.5C à 7h30) et suante. Vous la découvrez, et lui proposez de s'hydrater la bouche. Elle grimace en avalant le liquide. Vous remarquez alors des petits boutons blancs au niveau des muqueuses. Des soins de bouche sont alors prescrits par le médecin. Pour sa toilette vous lui proposez votre aide et de la réaliser au lit. Vous remarquez un érythème fessier ainsi qu'aux talons. Vous procédez à l'évaluation du risque d'escarre, le signalez à l'infirmier et commandez un matelas anti escarre que vous installerez à 13h dès réception." },
    { service: "Oncologie", sexe: "Masculin", problem: "Fatigue et douleur dorsale chez un patient récemment informé de son diagnostic", ageMin: 50, ageMax: 75, ageDisplay: 58, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un service de médecine oncologie et vous prenez en charge, en collaboration avec l'infirmier :\n\nMonsieur L. 58 ans, sans antécédents particuliers, peintre en bâtiment de profession, fumeur 35 P/A, sevré depuis 6 ans, Il a été adressé par son médecin généraliste pour un bilan pulmonaire (toux et crachats hémoptoïques apparus il y a 6 semaines, sans fièvre, sans altération de l'état général, sans dyspnée, douleurs dorsales).\n\nSuite à la biopsie effectuée, le diagnostic d'adénocarcinome pulmonaire est posé, le bilan d'extension réalisé montre 2 métastases localisées au niveau dorsal. Ce matin Mr L. ne veut pas se lever pour sa toilette, il est pâle, dit « se sentir épuisé ». Vous verbalise avoir mal dormi car il avait des douleurs atroces dans le dos qui l'ont empêché de trouver le sommeil. Il n'a pas sonné car ne voulait pas déranger. L'évaluation de la douleur révèle une EN 7/10 même au repos, douleur continue avec « une impression d'élancement dans la colonne ». Il avoue être conscient qu'il est « foutu », il s'est renseigné sur internet. Il a peur." },
    { service: "Oncologie", sexe: "Féminin", problem: "Repli sur soi et image de soi dégradée en cours de traitement", ageMin: 18, ageMax: 40, ageDisplay: 35, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un service de médecine oncologie et vous prenez en charge, en collaboration avec l'infirmier :\n\nVous accueillez Mme P. 35 ans pour sa 4ème cure de chimiothérapie. Elle est cadre de direction dans une entreprise internationale de transport, elle est fumeuse (5 cigarettes par jour), avec des antécédents familiaux de cancer du sein chez sa mère. Elle est en couple depuis 4 ans sans enfants et aime voyager.\n\nSon cancer a été découvert lors d'une consultation chez son gynécologue (la dernière datant de 2015) car elle avait comme projet de concevoir un enfant. Lors de l'examen clinique, le gynécologue palpe une masse au niveau du sein G et détecte la présence de plusieurs ganglions axillaires.\n\nSuite à plusieurs examens paracliniques, le diagnostic d'un cancer infiltrant type adénocarcinome a été retenu. La RCP a ensuite statué sur un traitement chirurgical (mastectomie sein G), chimiothérapie adjuvante et une radiothérapie en complément.\n\nA ce jour votre patiente présente un mutisme et semble triste alors que d'habitude elle est plutôt joviale. Elle arrive à vous verbaliser son agacement des traitements, sa perte d'envie, son asthénie grandissante, et ne se supporte plus (elle a perdu tous ses cheveux). Son compagnon n'est pas très présent." },
    { service: "Psychiatrie", sexe: "Féminin", problem: "Agitation majeure avec geste de mise en danger", ageMin: 18, ageMax: 40, ageDisplay: 29, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un service de psychiatrie et vous prenez en charge, en collaboration avec l'infirmier :\n\nMadame D., âgée de 29 ans, mariée, deux enfants de six et quatre ans, est hospitalisée le 2/05/2022 dans un service de psychiatrie à la demande de son mari.\n\nMadame D. est très agitée. Elle se déplace beaucoup, ne tient pas en place, va et vient dans le couloir en permanence. Elle se montre très exubérante et gesticule beaucoup.\nElle a craché à deux reprises dans le couloir. Elle s'exprime avec un débit verbal accéléré. Elle met son mari en cause et le prend à partie : elle dit ne plus le désirer.\nMadame D. est une femme de petite taille : 1,60m, 56 kg. Ses vêtements sont de couleurs très vives et disparates.\nElle a des sorties autorisées dans le parc. Ce matin, elle est sortie et elle est rentrée dans le service avec une plaie à l'avant-bras gauche. Elle se scarifie régulièrement. Au cours d'un entretien, elle apparait très agitée, elle explique qu'elle en a marre de la vie et qu'elle s'automutile avec les cannettes qu'elle prend à la machine à café.\nL'infirmier réalise alors un pansement sur sa plaie.\n\nElle est vue en urgence par le médecin psychiatre qui décide une mise en chambre d'isolement." },
    { service: "Psychiatrie", sexe: "Féminin", problem: "Amélioration progressive avec un risque associé à surveiller", ageMin: 18, ageMax: 64, ageDisplay: 40, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un service de psychiatrie et vous prenez en charge, en collaboration avec l'infirmier :\n\nMme L est hospitalisée depuis 10 jours, pour état dépressif.\n\nElle vient d'Afrique du Nord mais vit en France depuis l'âge de 8 ans. Sa vie a été marquée de nombreux deuils (a quitté son pays natal, rejet de sa famille, IVG, abandon de ses études). Elle vit actuellement avec un ami, qui travaille dans la librairie où elle est employée.\n\nDepuis plusieurs semaines Mme L. ne veut plus sortir, elle passe la majeure partie de son temps couchée avec les volets fermés. Elle a maigri.\n\nA l'entrée, elle présentait : un ralentissement psychomoteur, des idées de culpabilité évoquées en pleurant, une négligence de l'hygiène et vestimentaire et elle tenait des propos très négatifs.\n\nActuellement, Mme L. a une attelle plâtrée au pied droit car elle a une entorse à la suite d'une chute dans son jardin, il y a 14 jours. Elle est traitée avec un anticoagulant (fraxiparine 0.3 ml/ 24 heures) et a l'appui interdit. Une consultation est prévue demain.\n\nLe diagnostic évoque une dépression.\n\nA ce jour, l'humeur de Mme L est toujours triste, mais elle n'exprime plus d'idées de mort. Ce matin, elle a dit à l'aide-soignante qu'elle voulait rentrer chez elle. L'aide-soignante a rapporté que Mme L a été plus participative lors de sa douche et qu'elle a réclamé ses vêtements." },
    { service: "Psychiatrie", sexe: "Féminin", problem: "Absence temporaire de la patiente puis état de choc au retour", ageMin: 18, ageMax: 64, ageDisplay: 45, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un service de psychiatrie et vous prenez en charge, en collaboration avec l'infirmier :\n\nMme V âgée de 45 ans, a été hospitalisée pour la quatrième fois à sa demande suite à une tentative de suicide par ingestion de médicament.\n\nElle est suivie pour un syndrome post traumatique suite à des attouchements incestueux de son père pendant son enfance.\n\nCe jour elle ne présente pas pour le repas de midi. Elle ne se trouve pas dans sa chambre.\n\nUne recherche est effectuée dans l'établissement et un signalement a été effectué auprès de la hiérarchie et de l'accueil de la structure.\n\nEn début de l'après-midi vous cherchez la patiente, elle a été aperçue par un patient du service en ville.\n\nVous recevez ensuite un appel de l'accueil infirmier qui vous précise que Mme V vient d'être retrouvée par un infirmier du service.\n\nA votre arrivée dans le service, elle est prostrée et répète en boucle des mots inaudibles." },
    { service: "Gériatrie / EHPAD", sexe: "Féminin", problem: "Repli sur soi habituel puis énervement inhabituel un matin", ageMin: 75, ageMax: 120, ageDisplay: 80, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un EHPAD et vous prenez en charge, en collaboration avec l'infirmier :\n\nMme K. est rentrée dans cet EHPAD il y a 1 mois suite à une hospitalisation où son retour à domicile a été compromis. Depuis son admission Mme fuit la relation à l'autre, préfère rester dans sa chambre ne veut pas participer aux différentes activités proposées par la structure. Elle accepte néanmoins une aide pour la toilette le matin. Ce matin 8h dès son réveil Mme semble énervée et agacée lorsque vous lui demandez ce qu'elle souhaite pour son petit déjeuner ; « Vous le savez, comme d'habitude ! ». Mme est déjà habillée alors que vous ne l'avez pas aidée ce matin pour la toilette. Lorsque vous lui demandez pourquoi, elle vous menace et vous demande de la laisser tranquille. Vous le signalez à l'infirmière. A 9h, vous repassez la voir et constatez qu'elle ne s'y trouve pas. Son armoire et sa table de nuit sont vides. Mme a disparue. Vous vous empressez d'alerter l'équipe." },
    { service: "Gériatrie / EHPAD", sexe: "Féminin", problem: "Douleur nocturne rapportée puis découverte au sol", ageMin: 75, ageMax: 120, ageDisplay: 88, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un EHPAD et vous prenez en charge, en collaboration avec l'infirmier :\n\nMme O. 88 ans est une résidente sociable et enjouée. Elle est dans la structure depuis 10 ans. Elle avait été admise suite au décès de son époux car elle ne voulait pas rester seule chez elle, ses enfants étant éloignés d'elle géographiquement. Elle est battante et refuse de devenir dépendante. Elle a une mobilité défectueuse liée à une arthrose importante. Elle peine parfois dans ses déplacements mais refuse le fauteuil roulant. Ce matin elle vous verbalise avoir très mal dormi. Lorsque vous lui demandez pourquoi elle vous dit avoir eu très mal. Vous l'interrogez au sujet de cette douleur puis vous lui demandez de rester tranquille, et que vous viendrez aujourd'hui lui faire sa toilette au lavabo pour limiter cette douleur.\n\nA votre retour vous retrouvez Mme allongée au sol, l'adaptable couché sur elle avec des débris de verre tout autour d'elle. Elle vous dit avoir voulu se lever pour faire sa toilette au lavabo. Vous alertez l'infirmière et débutez le recueil de données." },
    { service: "Gériatrie / EHPAD", sexe: "Masculin", problem: "Tension avec un tiers puis symptôme urinaire rapporté en fin de journée", ageMin: 75, ageMax: 120, ageDisplay: 85, text: "Nous sommes le {today}, vos horaires de travail sont de huit heures à vingt heures. Vous travaillez dans un EHPAD et vous prenez en charge, en collaboration avec l'infirmier :\n\nMr P. 85 ans est une personne très solitaire mais respectueuse et polie. Il ne sollicite pas toujours les soignants. Il a gardé une certaine autonomie notamment dans les gestes de la vie quotidienne. Aujourd'hui à table Mr ne s'adresse pas à son voisin avec qui habituellement il converse. Ce dernier renverse pas erreur son verre sur la table. Mr P s'agace, s'énerve et insulte son voisin. Vous intervenez car vous sentez que la tension monte entre ses deux résidents. Vous raccompagnez Mr P (qui a terminé de manger) dans sa chambre.\n\nCet après-midi l'animatrice vient chercher Mr P pour une activité qu'il affectionne. A la fin de l'activité l'animatrice vous indique que Mr a fait de nombreux déplacements pour se rendre aux toilettes. Lorsque vous interrogez Mr il vous dit qu'en effet il se rend de nombreuses fois jour et nuit aux toilettes. Il a des envies pressentes d'uriner mais « ne fait pas grand'chose » d'après lui. Vous informez l'infirmier." },

  function ageRangeFor(service) {

      case "Oncologie":              return { min: 18, max: 120, unit: "ans" };
      default:                      return { min: 18, max: 120, unit: "ans" }; // secteurs adultes
    }
  }
  function clampAge(value, range) {
    let v = parseInt(value, 10);
    if (isNaN(v)) v = range.min;
    return Math.min(range.max, Math.max(range.min, v));
  }
  function ageSliderHTML(service, value) {
    const r = ageRangeFor(service);

  }

        <label for="f-code">Code formateur (facultatif)</label>
        <div class="code-row">
          <input type="text" id="f-code" placeholder="ex. AP / Pédiatrie / Masculin / 18 mois / Difficultés respiratoires" />
          <button class="btn btn-ghost" id="gen-code">Charger ce cas</button>
        </div>
        <span class="hint" id="code-hint">Réservé aux cas transmis par le formateur en séance.</span>
      </div>
    `;

    const rangeInfo = ageRangeFor(params.service);
    document.getElementById('f-age').addEventListener('input', e => {
      document.getElementById('age-readout-val').textContent = e.target.value;
    });
    document.getElementById('f-service').addEventListener('change', e => {
      params.service = e.target.value;
      params.probleme = firstProblem(params.service);
      document.getElementById('f-prob').innerHTML = probOpts(params.service, params.probleme);
      const built = ageSliderHTML(params.service, params.ageValue);
      params.ageValue = String(built.value);
      params.ageUnit = built.range.unit;
      document.getElementById('age-field').innerHTML = `<label>Âge du patient</label>${built.html}`;
      document.getElementById('f-age').addEventListener('input', ev => {
        document.getElementById('age-readout-val').textContent = ev.target.value;
      });
    });
    document.getElementById('gen').addEventListener('click', onGenerate);
    document.getElementById('gen-code').addEventListener('click', onGenerateCode);
    document.getElementById('f-code').addEventListener('keydown', e => { if (e.key === 'Enter') onGenerateCode(); });
  }

  function readParams() {
    params.service = document.getElementById('f-service').value;
    params.pro = document.getElementById('f-pro').value;
    const r = ageRangeFor(params.service);
    params.ageValue = document.getElementById('f-age').value;
    params.ageUnit = r.unit;
    params.sexe = document.getElementById('f-sexe').value;
    params.probleme = document.getElementById('f-prob').value.trim();
  }

  /* ---------------- GENERATION ---------------- */
  function onGenerate() {
    readParams();
    if (!params.probleme) { toast("Choisissez un problème de santé."); return; }
    renderLoading();
    setTimeout(() => { composeCase(); clearInterval(view._li); renderCase(); Scorm.recordCaseGenerated(); }, 480);
  }

  function onGenerateCode() {
    const raw = document.getElementById('f-code').value;
    const found = lookupSpecialCase(raw);
    const hintEl = document.getElementById('code-hint');
    if (!found) {
      hintEl.textContent = "Code non reconnu. Vérifiez la saisie transmise par le formateur.";
      hintEl.classList.add('err');
      return;
    }
    Object.assign(params, found.meta);
    renderLoading();
    setTimeout(() => {
      narrative = found.text;
      rows = found.correctionRows
        ? found.correctionRows.map(r => ({ ...r }))
        : [];
      clearInterval(view._li);
      renderCase();
      Scorm.recordCaseGenerated();
    }, 480);
  }

  function renderLoading() {
    const msgs = ["Installation du patient…","Recueil des observations…","On mêle l'utile et l'accessoire…","Rédaction du dossier…"];
    view.innerHTML = `<div class="loading"><div class="spinner"></div><p id="lmsg">${msgs[0]}</p></div>`;
    let i = 0;
    const lmsg = document.getElementById('lmsg');
    view._li = setInterval(() => { i = (i+1) % msgs.length; if (lmsg) lmsg.textContent = msgs[i]; }, 1400);
  }

  function findBankCase() {
    const age = parseInt(params.ageValue, 10);
    if (isNaN(age)) return null;
    return BANK_CASES.find(b =>
      b.service === params.service &&
      b.sexe === params.sexe &&
      b.problem === params.probleme &&
      age >= b.ageMin && age <= b.ageMax
    ) || null;
  }

  function todayFR() {
    const d = new Date();
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function composeCase() {
    const bankCase = findBankCase();
    if (bankCase) { narrative = bankCase.text.split('{today}').join(todayFR()); return; }
    const c = makeCtx();
    const list = PROBLEMS[params.service] || [];
    const entry = list.find(p => p.label === params.probleme) || list[0];
    narrative = entry ? buildCase(entry, c) : "Aucun modèle disponible pour ce paramétrage.";
  }

  /* ---------------- CASE SCREEN ---------------- */
  function highlightName(txt) {
    // colour the first proper-noun-looking token to help the reader spot the patient
    let done = false;
    return esc(txt).replace(/\b([A-ZÉÈÀÂÎ][a-zéèêàâîïüç]+)\b/, (m) => {
      if (done) return m; done = true; return `<span class="name">${m}</span>`;
    });
  }

  function renderCase() {
    if (rows.length === 0) rows = [emptyRow(), emptyRow()];
    const ageLabel = `${esc(params.ageValue)} ${esc(params.ageUnit)}`;
    view.innerHTML = `
      <div class="meta-bar">
        <span class="tag"><b>${esc(params.service)}</b></span>
        <span class="tag">Rédacteur : <b>${esc(params.pro)}</b></span>
        <span class="tag">Patient : <b>${ageLabel}</b> · ${esc(params.sexe)}</span>
        <span class="tag">Problème : <b>${esc(params.probleme)}</b></span>
      </div>

      <div class="case-layout">
        <section class="panel">
          <div class="panel-head"><h2>La situation</h2><span class="sub">récit non trié</span></div>
          <div class="narrative">${highlightName(narrative)}</div>
          <div class="notice">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="#B23A32" stroke-width="1.4"/><path d="M8 4.4v5M8 11.4v.2" stroke="#B23A32" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Le récit mêle à dessein l'utile et l'accessoire, l'objectif et le ressenti. Repérez la cible, puis triez.</span>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Transmission ciblée</h2>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="sub">à compléter</span>
              <button class="gear-btn" id="gear-btn" title="Espace formateur" aria-label="Espace formateur">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              </button>
            </div>
          </div>
          <div class="table-scroll">
            <table class="dar">
              <thead>
                <tr>
                  <th style="width:15%">Identification</th>
                  <th class="col-cible" style="width:15%">Cible</th>
                  <th style="width:24%">Données</th>
                  <th style="width:23%">Actions</th>
                  <th style="width:23%">Résultats</th>
                  <th class="row-tools"></th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="table-foot">
            <button class="add-row" id="addrow">+ Ajouter une cible</button>
            <span class="hint">Astuce : dans « Identification », notez qui écrit et quand — initiales, date, heure, fonction. Une ligne par cible.</span>
          </div>
        </section>
      </div>

      <div class="footer-actions">
        <button class="btn btn-primary" id="word">Télécharger en Word</button>
        <button class="btn btn-ghost" id="copy">Copier le texte</button>
        <button class="btn btn-ghost" id="restart">Nouveau cas</button>
      </div>
    `;
    renderRows();
    document.getElementById('addrow').addEventListener('click', () => { rows.push(emptyRow()); renderRows(); });
    document.getElementById('gear-btn').addEventListener('click', openGodMode);
    document.getElementById('word').addEventListener('click', downloadWord);
    document.getElementById('copy').addEventListener('click', copyExport);
    document.getElementById('restart').addEventListener('click', restart);
  }

  function emptyRow() { return { ident: params.pro ? "Fonction : " + params.pro : "", cible:"", donnees:"", actions:"", resultats:"" }; }

  function cibleSelectHTML(value) {
    const bank = cibleBankFor(params.pro);
    if (!bank) return `<div class="cell" contenteditable data-k="cible" data-ph="Le problème en 2-3 mots">${esc(value)}</div>`;
    const opts = bank.map(g =>
      `<optgroup label="${esc(g.groupe)}">` +
      g.items.map(i => `<option ${i===value?'selected':''}>${esc(i)}</option>`).join('') +
      `</optgroup>`
    ).join('');
    return `<select class="cell-select" data-k="cible"><option value="" ${value?'':'selected'} disabled>Choisir une cible…</option>${opts}</select>`;
  }

  function renderRows() {
    const tb = document.getElementById('tbody');
    tb.innerHTML = "";
    rows.forEach((r, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="identcol"><div class="cell" contenteditable data-k="ident" data-ph="Initiales, date, heure, fonction">${esc(r.ident)}</div></td>
        <td class="col-cible">${cibleSelectHTML(r.cible)}</td>
        <td><div class="cell" contenteditable data-k="donnees" data-ph="Faits observés, chiffres, paroles">${esc(r.donnees)}</div></td>
        <td><div class="cell" contenteditable data-k="actions" data-ph="Ce qui est mis en œuvre">${esc(r.actions)}</div></td>
        <td><div class="cell" contenteditable data-k="resultats" data-ph="Effet, réévaluation">${esc(r.resultats)}</div></td>
        <td class="row-tools"><button class="del-row" title="Supprimer la ligne" aria-label="Supprimer la ligne">×</button></td>
      `;
      tr.querySelectorAll('.cell[contenteditable]').forEach(c => {
        c.addEventListener('input', () => { rows[idx][c.dataset.k] = c.textContent; });
      });
      const sel = tr.querySelector('select.cell-select');
      if (sel) sel.addEventListener('change', () => { rows[idx].cible = sel.value; });
      tr.querySelector('.del-row').addEventListener('click', () => {
        if (rows.length === 1) { rows[0] = emptyRow(); } else { rows.splice(idx, 1); }
        renderRows();
      });
      tb.appendChild(tr);
    });
  }

  /* ---------------- EXPORT ---------------- */
  function buildExport() {
    const L = [];
    L.push("CAS CONCRET — TRANSMISSIONS CIBLÉES");
    L.push("=".repeat(42));
    L.push(`Service        : ${params.service}`);
    L.push(`Rédacteur      : ${params.pro}`);
    L.push(`Patient        : ${params.ageValue} ${params.ageUnit} · ${params.sexe}`);
    L.push(`Problème       : ${params.probleme}`);
    L.push("");
    L.push("LA SITUATION");
    L.push("-".repeat(42));
    L.push(narrative);
    L.push("");
    L.push("TRANSMISSION CIBLÉE");
    L.push("-".repeat(42));
    rows.forEach((r, i) => {
      const any = r.ident||r.cible||r.donnees||r.actions||r.resultats;
      if (!any) return;
      L.push(`• Cible ${i+1} : ${r.cible || "—"}`);
      if (r.ident)     L.push(`  Identification : ${r.ident}`);
      L.push(`  Données   : ${r.donnees || "—"}`);
      L.push(`  Actions   : ${r.actions || "—"}`);
      L.push(`  Résultats : ${r.resultats || "—"}`);
      L.push("");
    });
    return L.join("\n");
  }

  function copyExport() {
    const txt = buildExport();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => toast("Copié dans le presse-papier."), fallbackCopy.bind(null, txt));
    } else fallbackCopy(txt);
  }
  function fallbackCopy(txt) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast("Copié dans le presse-papier."); }
    catch (e) { toast("Copie impossible — utilisez le téléchargement."); }
    document.body.removeChild(ta);
  }

  function slug() {
    return (params.service + "-" + params.probleme).toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'cas';
  }
  function filledRows() {
    return rows.filter(r => r.ident||r.cible||r.donnees||r.actions||r.resultats);
  }

  function docStyles() {
    return `
 body { font-family: Calibri, Arial, sans-serif; color:#1a1a1a; font-size:11pt; margin:24pt; }
 h1 { font-family:Georgia, serif; color:#163A40; font-size:17pt; margin:0 0 4pt; }
 .rule { border:none; border-top:2pt solid #B23A32; width:48pt; margin:0 0 10pt; }
 .meta { color:#4E676B; font-size:10pt; margin:1pt 0; }
 h2 { color:#2B6E7C; font-size:11pt; letter-spacing:1pt; margin:16pt 0 6pt; }
 .narr p { line-height:1.5; margin:0 0 6pt; }
 table { border-collapse:collapse; width:100%; font-size:10pt; margin-top:6pt; }
 th, td { border:0.5pt solid #B9C1B8; padding:5pt 6pt; vertical-align:top; }
 th { background:#163A40; color:#fff; text-align:left; font-size:9pt; }
 th.cb { background:#B23A32; }
 td.cb { color:#B23A32; font-weight:bold; }
 td.id { background:#F1F3EE; }
 tr { page-break-inside: avoid; }`;
  }

  function docInner() {
    const br = s => esc(s).replace(/\n/g, '<br>');
    const body = filledRows().map(r =>
      `<tr>
        <td class="id">${br(r.ident)}</td>
        <td class="cb">${br(r.cible)}</td>
        <td>${br(r.donnees)}</td>
        <td>${br(r.actions)}</td>
        <td>${br(r.resultats)}</td>
      </tr>`).join('');
    return `
<h1>Cas concret — transmissions ciblées</h1>
<hr class="rule">
<p class="meta"><b>Service :</b> ${esc(params.service)}</p>
<p class="meta"><b>Rédacteur :</b> ${esc(params.pro)}</p>
<p class="meta"><b>Patient :</b> ${esc(params.ageValue)} ${esc(params.ageUnit)} · ${esc(params.sexe)}</p>
<p class="meta"><b>Problème :</b> ${esc(params.probleme)}</p>
<h2>LA SITUATION</h2>
<div class="narr">${narrative.split(/\n{2,}/).map(p => `<p>${br(p)}</p>`).join('')}</div>
<h2>TRANSMISSION CIBLÉE</h2>
<table>
 <tr><th>Identification</th><th class="cb">Cible</th><th>Données</th><th>Actions</th><th>Résultats</th></tr>
 ${body}
</table>`;
  }

  function downloadWord() {
    // La balise de style du document Word est construite par concaténation,
    // pour ne jamais faire apparaître ce type de balise en clair dans le code
    // (certains moteurs de rendu l'interprètent et cassent l'affichage de la page).
    const styleTag = '<' + 'style>' + docStyles() + '<' + '/style>';
    const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
      + '<head><meta charset="utf-8">' + styleTag + '</head><body>' + docInner() + '</body></html>';
    const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `transmission-${slug()}.doc`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Document Word téléchargé.");
  }

  function restart() {
    narrative = ""; rows = [];
    renderSetup();
    view.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  renderSetup();
})();
</script>
</body>
</html>
